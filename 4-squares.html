<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4 Squares Tracking Marker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    h1 { margin-bottom: 12px; font-size: 20px; color: #111; }
    p { margin-bottom: 24px; color: #444; font-size: 14px; text-align: center; max-width: 340px; }
    .marker {
      width: min(90vw, 420px);
      height: min(90vw, 420px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 18%;
      padding: 10%;
      background: #fff;
      border: 4px solid #000;
    }
    .sq {
      background: #000;
      border-radius: 4px;
    }
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #666;
      text-align: center;
      max-width: 360px;
    }
  </style>
</head>
<body>
  <h1>4 Squares Tracking Marker</h1>
  <p>Print this page or show it full-screen.<br>Use with BlenderTrack / Prisma / any marker tracker.</p>

  <div class="marker">
    <div class="sq"></div>
    <div class="sq"></div>
    <div class="sq"></div>
    <div class="sq"></div>
  </div>

  <p class="note">
    High-contrast black squares on white.<br>
    Keep the page flat and well-lit for best tracking.<br>
    You can also screenshot this and print it.
  </p>
</body>
</html>

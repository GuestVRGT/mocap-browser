<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Browser MonkeMocap 🐒</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background: #0d1117; color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #ui {
      position: absolute; top: 12px; left: 12px; z-index: 20;
      background: rgba(13,17,23,0.9); padding: 14px 16px;
      border-radius: 12px; border: 1px solid #30363d;
      max-width: 340px; font-size: 13px; line-height: 1.45;
    }
    #ui h1 { margin: 0 0 6px; font-size: 18px; color: #7ee787; }
    #ui p { margin: 0 0 10px; opacity: 0.85; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    button {
      padding: 8px 12px; border: none; border-radius: 8px;
      font-weight: 600; font-size: 12px; cursor: pointer;
    }
    button:active { transform: scale(0.96); }
    #recordBtn { background: #da3633; color: white; }
    #recordBtn.recording { background: #f85149; animation: pulse 1s infinite; }
    #stopBtn { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
    #downloadBody { background: #238636; color: white; }
    #downloadNonames { background: #1f6feb; color: white; }
    #downloadGltf { background: #8957e5; color: white; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
    #status { margin-top: 10px; font-size: 12px; color: #8b949e; }
    #video {
      position: absolute; bottom: 12px; right: 12px;
      width: 160px; height: 120px; border: 2px solid #30363d;
      border-radius: 10px; z-index: 10; transform: scaleX(-1);
      object-fit: cover; background: #000;
    }
    #canvas-container { width: 100vw; height: 100vh; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Browser MonkeMocap 🐒</h1>
    <p>Body tracking + exports<br>
    • Body JSON<br>
    • Nonames JSON<br>
    • <b>GLTF (4 cubes)</b> named <code>torso</code>, <code>head</code>, <code>hand.L</code>, <code>hand.R</code></p>
    <div class="btn-row">
      <button id="recordBtn">● Record</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>
    <div class="btn-row">
      <button id="downloadBody" disabled>Body JSON</button>
      <button id="downloadNonames" disabled>Nonames JSON</button>
      <button id="downloadGltf" disabled>GLTF (4 cubes)</button>
    </div>
    <div id="status">Waiting for camera…</div>
  </div>

  <video id="video" playsinline muted></video>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 4.5);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x404040));
    const light = new THREE.DirectionalLight(0xffffff, 1.0);
    light.position.set(3, 8, 5);
    scene.add(light);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshLambertMaterial({ color: 0x161b22 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Live preview
    const jointMat = new THREE.MeshLambertMaterial({ color: 0x7ee787 });
    const boneMat = new THREE.MeshLambertMaterial({ color: 0x3fb950 });
    const joints = [];
    const bones = [];
    const POSE_CONNECTIONS = [
      [11,12],[11,13],[13,15],[12,14],[14,16],
      [11,23],[12,24],[23,24],
      [23,25],[25,27],[24,26],[26,28]
    ];

    for (let i = 0; i < 33; i++) {
      const j = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), jointMat);
      j.visible = false;
      scene.add(j);
      joints.push(j);
    }
    POSE_CONNECTIONS.forEach(() => {
      const b = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 1), boneMat);
      b.visible = false;
      scene.add(b);
      bones.push(b);
    });

    let recording = false;
    let recordedFrames = [];
    let startTime = 0;

    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBody = document.getElementById('downloadBody');
    const downloadNonames = document.getElementById('downloadNonames');
    const downloadGltf = document.getElementById('downloadGltf');
    const statusEl = document.getElementById('status');

    recordBtn.addEventListener('click', () => {
      recording = true;
      recordedFrames = [];
      startTime = performance.now();
      recordBtn.classList.add('recording');
      recordBtn.textContent = '● Recording…';
      recordBtn.disabled = true;
      stopBtn.disabled = false;
      downloadBody.disabled = true;
      downloadNonames.disabled = true;
      downloadGltf.disabled = true;
      statusEl.textContent = 'Recording… move around!';
    });

    stopBtn.addEventListener('click', () => {
      recording = false;
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '● Record';
      recordBtn.disabled = false;
      stopBtn.disabled = true;
      const has = recordedFrames.length > 0;
      downloadBody.disabled = !has;
      downloadNonames.disabled = !has;
      downloadGltf.disabled = !has;
      statusEl.textContent = `Stopped. ${recordedFrames.length} frames.`;
    });

    downloadBody.addEventListener('click', () => {
      const payload = {
        version: 1,
        type: 'mediapipe-pose',
        frameCount: recordedFrames.length,
        recordedAt: new Date().toISOString(),
        frames: recordedFrames
      };
      downloadJSON(payload, `monke-body-${Date.now()}.json`);
      statusEl.textContent = 'Body pose JSON downloaded.';
    });

    downloadNonames.addEventListener('click', () => {
      const cameraPoseList = recordedFrames.map((frame, i) => {
        const nose = frame.landmarks[0] || { x: 0.5, y: 0.5, z: 0 };
        const x = (nose.x - 0.5) * 2.0;
        const y = (0.5 - nose.y) * 1.5 + 1.5;
        const z = -nose.z * 3.0 - 2.5;
        return {
          frame: i,
          time: frame.t,
          position: { x, y, z },
          rotation: { x: (nose.y-0.5)*0.5, y: (nose.x-0.5)*0.8, z: 0 }
        };
      });
      const payload = {
        cameraPoseList,
        bodyPoseFrames: recordedFrames,
        version: 1,
        source: 'browser-monkemocap'
      };
      downloadJSON(payload, `monke-nonames-${Date.now()}.json`);
      statusEl.textContent = 'Nonames JSON downloaded.';
    });

    // GLTF with 4 cubes named after the main gorilla bones
    downloadGltf.addEventListener('click', () => {
      if (recordedFrames.length === 0) return;
      statusEl.textContent = 'Building GLTF (torso + head + hand.L + hand.R)…';

      const exportScene = new THREE.Scene();

      const torsoMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
      const headMat  = new THREE.MeshStandardMaterial({ color: 0xA0522D });
      const armMat   = new THREE.MeshStandardMaterial({ color: 0xCD853F });

      // Cubes named exactly like the main parts of the gorilla rig
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.85, 0.35), torsoMat);
      torso.name = 'torso';
      exportScene.add(torso);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.38), headMat);
      head.name = 'head';
      exportScene.add(head);

      const leftHand = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.22), armMat);
      leftHand.name = 'hand.L';
      exportScene.add(leftHand);

      const rightHand = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.22), armMat);
      rightHand.name = 'hand.R';
      exportScene.add(rightHand);

      function lmToPos(lm) {
        return new THREE.Vector3(
          (lm.x - 0.5) * 3.5,
          (0.5 - lm.y) * 3.5 + 1.0,
          -lm.z * 2.5
        );
      }

      const times = recordedFrames.map(f => f.t);
      const duration = times[times.length - 1] || 1;

      function makePosTrack(name, getPosFn) {
        const values = [];
        recordedFrames.forEach(frame => {
          const p = getPosFn(frame.landmarks);
          values.push(p.x, p.y, p.z);
        });
        return new THREE.VectorKeyframeTrack(name + '.position', times, values);
      }

      // torso = average of left + right shoulder (11 + 12)
      const torsoTrack = makePosTrack('torso', (lms) => {
        const l = lmToPos(lms[11] || {x:0.45,y:0.45,z:0});
        const r = lmToPos(lms[12] || {x:0.55,y:0.45,z:0});
        return new THREE.Vector3().addVectors(l, r).multiplyScalar(0.5);
      });

      // head = nose (0)
      const headTrack = makePosTrack('head', (lms) => lmToPos(lms[0] || {x:0.5,y:0.35,z:0}));

      // hand.L = left wrist (15)
      const leftHandTrack = makePosTrack('hand.L', (lms) => lmToPos(lms[15] || {x:0.3,y:0.7,z:0}));

      // hand.R = right wrist (16)
      const rightHandTrack = makePosTrack('hand.R', (lms) => lmToPos(lms[16] || {x:0.7,y:0.7,z:0}));

      const clip = new THREE.AnimationClip('MonkeCubes', duration, [
        torsoTrack, headTrack, leftHandTrack, rightHandTrack
      ]);

      const exporter = new THREE.GLTFExporter();
      exporter.parse(
        exportScene,
        (result) => {
          const blob = new Blob([JSON.stringify(result)], { type: 'model/gltf+json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `monke-torso-head-hands-${Date.now()}.gltf`;
          a.click();
          URL.revokeObjectURL(url);
          statusEl.textContent = 'GLTF downloaded! Cubes named: torso, head, hand.L, hand.R';
        },
        { animations: [clip], binary: false }
      );
    });

    function downloadJSON(obj, filename) {
      const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // MediaPipe
    const videoElement = document.getElementById('video');

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults((results) => {
      if (!results.poseLandmarks) {
        joints.forEach(j => j.visible = false);
        bones.forEach(b => b.visible = false);
        return;
      }

      results.poseLandmarks.forEach((lm, i) => {
        const j = joints[i];
        j.visible = lm.visibility > 0.3;
        j.position.set(
          (lm.x - 0.5) * 3.5,
          (0.5 - lm.y) * 3.5 + 1.2,
          -lm.z * 2.5
        );
      });

      POSE_CONNECTIONS.forEach((conn, idx) => {
        const a = joints[conn[0]];
        const b = joints[conn[1]];
        const bone = bones[idx];
        if (!a.visible || !b.visible) { bone.visible = false; return; }
        bone.visible = true;
        const mid = new THREE.Vector3().addVectors(a.position, b.position).multiplyScalar(0.5);
        bone.position.copy(mid);
        const dir = new THREE.Vector3().subVectors(b.position, a.position);
        const len = dir.length();
        bone.scale.set(1, len, 1);
        bone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
      });

      if (recording) {
        const t = (performance.now() - startTime) / 1000;
        recordedFrames.push({
          t,
          landmarks: results.poseLandmarks.map(lm => ({
            x: lm.x, y: lm.y, z: lm.z, visibility: lm.visibility
          }))
        });
        if (recordedFrames.length % 30 === 0) {
          statusEl.textContent = `Recording… ${recordedFrames.length} frames`;
        }
      }
    });

    async function start() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 640, height: 480 },
          audio: false
        });
        videoElement.srcObject = stream;
        await videoElement.play();

        const cam = new Camera(videoElement, {
          onFrame: async () => { await pose.send({ image: videoElement }); },
          width: 640, height: 480
        });
        cam.start();
        statusEl.textContent = 'Camera ready! Record then export GLTF (torso / head / hand.L / hand.R).';
      } catch (err) {
        statusEl.textContent = 'Camera error: ' + err.message;
      }
    }
    start();

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Browser MonkeMocap 🐒</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background: #0d1117; color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #ui {
      position: absolute; top: 12px; left: 12px; z-index: 20;
      background: rgba(13,17,23,0.92); padding: 14px 16px;
      border-radius: 12px; border: 1px solid #30363d;
      max-width: 360px; font-size: 13px; line-height: 1.45;
    }
    #ui h1 { margin: 0 0 6px; font-size: 18px; color: #7ee787; }
    #ui p { margin: 0 0 10px; opacity: 0.85; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    button {
      padding: 8px 12px; border: none; border-radius: 8px;
      font-weight: 600; font-size: 12px; cursor: pointer;
    }
    button:active { transform: scale(0.96); }
    #recordBtn { background: #da3633; color: white; }
    #recordBtn.recording { background: #f85149; animation: pulse 1s infinite; }
    #stopBtn { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
    #downloadBody { background: #238636; color: white; }
    #downloadNonames { background: #1f6feb; color: white; }
    #downloadGltf { background: #8957e5; color: white; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
    #status { margin-top: 10px; font-size: 12px; color: #8b949e; }
    #video {
      position: absolute; bottom: 12px; right: 12px;
      width: 160px; height: 120px; border: 2px solid #30363d;
      border-radius: 10px; z-index: 10; transform: scaleX(-1);
      object-fit: cover; background: #000;
    }
    #canvas-container { width: 100vw; height: 100vh; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Browser MonkeMocap 🐒</h1>
    <p>Live cube preview + ground clamp<br>
    Arms never go below Y=0. If they try, the whole body lifts.</p>
    <div class="btn-row">
      <button id="recordBtn">● Record</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>
    <div class="btn-row">
      <button id="downloadBody" disabled>Body JSON</button>
      <button id="downloadNonames" disabled>Nonames JSON</button>
      <button id="downloadGltf" disabled>GLTF (cubes)</button>
    </div>
    <div id="status">Waiting for camera…</div>
  </div>

  <video id="video" playsinline muted></video>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 2.2, 5.5);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x555555));
    const light = new THREE.DirectionalLight(0xffffff, 1.1);
    light.position.set(4, 10, 6);
    scene.add(light);

    // Ground plane at Y=0
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshLambertMaterial({ color: 0x1a2332 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    // Grid helper
    const grid = new THREE.GridHelper(20, 20, 0x30363d, 0x21262d);
    grid.position.y = 0.01;
    scene.add(grid);

    // ===== LIVE PREVIEW CUBES =====
    const torsoMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.4 });
    const headMat  = new THREE.MeshStandardMaterial({ color: 0xA0522D, roughness: 0.4 });
    const armMat   = new THREE.MeshStandardMaterial({ color: 0xCD853F, roughness: 0.4 });

    const previewTorso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.85, 0.35), torsoMat);
    previewTorso.name = 'torso';
    scene.add(previewTorso);

    const previewHead = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.38), headMat);
    previewHead.name = 'head';
    scene.add(previewHead);

    const previewUpperL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.45, 0.18), armMat);
    previewUpperL.name = 'upper_arm.L';
    scene.add(previewUpperL);

    const previewForeL = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.40, 0.16), armMat);
    previewForeL.name = 'forearm.L';
    scene.add(previewForeL);

    const previewUpperR = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.45, 0.18), armMat);
    previewUpperR.name = 'upper_arm.R';
    scene.add(previewUpperR);

    const previewForeR = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.40, 0.16), armMat);
    previewForeR.name = 'forearm.R';
    scene.add(previewForeR);

    // Hide until we have tracking
    [previewTorso, previewHead, previewUpperL, previewForeL, previewUpperR, previewForeR].forEach(c => c.visible = false);

    let recording = false;
    let recordedFrames = [];
    let startTime = 0;

    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBody = document.getElementById('downloadBody');
    const downloadNonames = document.getElementById('downloadNonames');
    const downloadGltf = document.getElementById('downloadGltf');
    const statusEl = document.getElementById('status');

    recordBtn.addEventListener('click', () => {
      recording = true;
      recordedFrames = [];
      startTime = performance.now();
      recordBtn.classList.add('recording');
      recordBtn.textContent = '● Recording…';
      recordBtn.disabled = true;
      stopBtn.disabled = false;
      downloadBody.disabled = true;
      downloadNonames.disabled = true;
      downloadGltf.disabled = true;
      statusEl.textContent = 'Recording… move around!';
    });

    stopBtn.addEventListener('click', () => {
      recording = false;
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '● Record';
      recordBtn.disabled = false;
      stopBtn.disabled = true;
      const has = recordedFrames.length > 0;
      downloadBody.disabled = !has;
      downloadNonames.disabled = !has;
      downloadGltf.disabled = !has;
      statusEl.textContent = `Stopped. ${recordedFrames.length} frames.`;
    });

    downloadBody.addEventListener('click', () => {
      const payload = {
        version: 1,
        type: 'mediapipe-pose',
        frameCount: recordedFrames.length,
        recordedAt: new Date().toISOString(),
        frames: recordedFrames
      };
      downloadJSON(payload, `monke-body-${Date.now()}.json`);
      statusEl.textContent = 'Body pose JSON downloaded.';
    });

    downloadNonames.addEventListener('click', () => {
      const cameraPoseList = recordedFrames.map((frame, i) => {
        const nose = frame.landmarks[0] || { x: 0.5, y: 0.5, z: 0 };
        const x = (nose.x - 0.5) * 2.0;
        const y = (0.5 - nose.y) * 1.5 + 1.5;
        const z = -nose.z * 3.0 - 2.5;
        return {
          frame: i,
          time: frame.t,
          position: { x, y, z },
          rotation: { x: (nose.y-0.5)*0.5, y: (nose.x-0.5)*0.8, z: 0 }
        };
      });
      const payload = {
        cameraPoseList,
        bodyPoseFrames: recordedFrames,
        version: 1,
        source: 'browser-monkemocap'
      };
      downloadJSON(payload, `monke-nonames-${Date.now()}.json`);
      statusEl.textContent = 'Nonames JSON downloaded.';
    });

    // ===== Helpers =====
    function lmToPos(lm) {
      // MediaPipe: x right, y down, z toward camera
      // We want: x right, y up, z toward camera (negative)
      return new THREE.Vector3(
        (lm.x - 0.5) * 3.2,
        (0.5 - lm.y) * 3.2,   // no extra +1.0 offset here
        -lm.z * 2.2
      );
    }

    // Apply ground clamp: find lowest arm Y, if < 0 lift everything by that amount
    function applyGroundClamp(positions) {
      // positions = { torso, head, upperL, foreL, upperR, foreR }
      const armYs = [
        positions.upperL.y - 0.225, // half height of upper arm box
        positions.foreL.y  - 0.20,
        positions.upperR.y - 0.225,
        positions.foreR.y  - 0.20
      ];
      const lowest = Math.min(...armYs);
      let lift = 0;
      if (lowest < 0) {
        lift = -lowest; // push everything up so lowest = 0
      }
      // Also make sure torso doesn't go too low
      const torsoBottom = positions.torso.y - 0.425;
      if (torsoBottom + lift < 0.1) {
        lift = Math.max(lift, -torsoBottom + 0.1);
      }

      positions.torso.y += lift;
      positions.head.y  += lift;
      positions.upperL.y += lift;
      positions.foreL.y  += lift;
      positions.upperR.y += lift;
      positions.foreR.y  += lift;

      return lift;
    }

    function computeCubePositions(landmarks) {
      const lShoulder = lmToPos(landmarks[11] || {x:0.4,y:0.45,z:0});
      const rShoulder = lmToPos(landmarks[12] || {x:0.6,y:0.45,z:0});
      const lElbow    = lmToPos(landmarks[13] || {x:0.35,y:0.55,z:0});
      const rElbow    = lmToPos(landmarks[14] || {x:0.65,y:0.55,z:0});
      const lWrist    = lmToPos(landmarks[15] || {x:0.3,y:0.7,z:0});
      const rWrist    = lmToPos(landmarks[16] || {x:0.7,y:0.7,z:0});
      const nose      = lmToPos(landmarks[0]  || {x:0.5,y:0.35,z:0});

      const torso = new THREE.Vector3().addVectors(lShoulder, rShoulder).multiplyScalar(0.5);
      // slight downward bias so torso sits under the shoulders
      torso.y -= 0.15;

      const head = nose.clone();
      head.y += 0.15; // sit on top of neck area

      const upperL = new THREE.Vector3().addVectors(lShoulder, lElbow).multiplyScalar(0.5);
      const foreL  = new THREE.Vector3().addVectors(lElbow, lWrist).multiplyScalar(0.5);
      const upperR = new THREE.Vector3().addVectors(rShoulder, rElbow).multiplyScalar(0.5);
      const foreR  = new THREE.Vector3().addVectors(rElbow, rWrist).multiplyScalar(0.5);

      const positions = { torso, head, upperL, foreL, upperR, foreR };
      applyGroundClamp(positions);
      return positions;
    }

    // ===== GLTF export =====
    downloadGltf.addEventListener('click', () => {
      if (recordedFrames.length === 0) return;
      statusEl.textContent = 'Building GLTF with ground-clamped cubes…';

      const exportScene = new THREE.Scene();

      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.85, 0.35), torsoMat.clone());
      torso.name = 'torso';
      exportScene.add(torso);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.38), headMat.clone());
      head.name = 'head';
      exportScene.add(head);

      const upperArmL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.45, 0.18), armMat.clone());
      upperArmL.name = 'upper_arm.L';
      exportScene.add(upperArmL);

      const forearmL = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.40, 0.16), armMat.clone());
      forearmL.name = 'forearm.L';
      exportScene.add(forearmL);

      const upperArmR = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.45, 0.18), armMat.clone());
      upperArmR.name = 'upper_arm.R';
      exportScene.add(upperArmR);

      const forearmR = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.40, 0.16), armMat.clone());
      forearmR.name = 'forearm.R';
      exportScene.add(forearmR);

      const times = recordedFrames.map(f => f.t);
      const duration = times[times.length - 1] || 1;

      function makePosTrack(name, getter) {
        const values = [];
        recordedFrames.forEach(frame => {
          const pos = computeCubePositions(frame.landmarks);
          const p = getter(pos);
          values.push(p.x, p.y, p.z);
        });
        return new THREE.VectorKeyframeTrack(name + '.position', times, values);
      }

      const clip = new THREE.AnimationClip('MonkeCubes', duration, [
        makePosTrack('torso', p => p.torso),
        makePosTrack('head',  p => p.head),
        makePosTrack('upper_arm.L', p => p.upperL),
        makePosTrack('forearm.L',  p => p.foreL),
        makePosTrack('upper_arm.R', p => p.upperR),
        makePosTrack('forearm.R',  p => p.foreR)
      ]);

      const exporter = new THREE.GLTFExporter();
      exporter.parse(
        exportScene,
        (result) => {
          const blob = new Blob([JSON.stringify(result)], { type: 'model/gltf+json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `monke-cubes-clamped-${Date.now()}.gltf`;
          a.click();
          URL.revokeObjectURL(url);
          statusEl.textContent = 'GLTF downloaded! Cubes are ground-clamped.';
        },
        { animations: [clip], binary: false }
      );
    });

    function downloadJSON(obj, filename) {
      const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ===== MediaPipe =====
    const videoElement = document.getElementById('video');

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults((results) => {
      if (!results.poseLandmarks) {
        [previewTorso, previewHead, previewUpperL, previewForeL, previewUpperR, previewForeR].forEach(c => c.visible = false);
        return;
      }

      const pos = computeCubePositions(results.poseLandmarks);

      previewTorso.position.copy(pos.torso);
      previewHead.position.copy(pos.head);
      previewUpperL.position.copy(pos.upperL);
      previewForeL.position.copy(pos.foreL);
      previewUpperR.position.copy(pos.upperR);
      previewForeR.position.copy(pos.foreR);

      [previewTorso, previewHead, previewUpperL, previewForeL, previewUpperR, previewForeR].forEach(c => c.visible = true);

      if (recording) {
        const t = (performance.now() - startTime) / 1000;
        recordedFrames.push({
          t,
          landmarks: results.poseLandmarks.map(lm => ({
            x: lm.x, y: lm.y, z: lm.z, visibility: lm.visibility
          }))
        });
        if (recordedFrames.length % 30 === 0) {
          statusEl.textContent = `Recording… ${recordedFrames.length} frames`;
        }
      }
    });

    async function start() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 640, height: 480 },
          audio: false
        });
        videoElement.srcObject = stream;
        await videoElement.play();

        const cam = new Camera(videoElement, {
          onFrame: async () => { await pose.send({ image: videoElement }); },
          width: 640, height: 480
        });
        cam.start();
        statusEl.textContent = 'Camera ready! Cubes will appear when body is detected.';
      } catch (err) {
        statusEl.textContent = 'Camera error: ' + err.message;
      }
    }
    start();

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>

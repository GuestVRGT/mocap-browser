<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Monke · BlenderTrack style</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #111; font-family: -apple-system, BlinkMacSystemFont, sans-serif; touch-action: none; }
    #ui {
      position: absolute; inset: 0; z-index: 40;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88); color: white; text-align: center; padding: 24px;
    }
    #ui h1 { font-size: 24px; margin: 0 0 8px; }
    #ui p { font-size: 14px; opacity: 0.85; margin: 0 0 20px; max-width: 300px; }
    #startBtn {
      padding: 16px 30px; font-size: 17px; border: none; border-radius: 14px;
      background: #4cbf56; color: white; font-weight: 600;
      box-shadow: 0 4px 18px rgba(76,191,86,0.45);
    }
    #status { margin-top: 14px; font-size: 13px; opacity: 0.75; min-height: 18px; }
    #info {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      color: white; background: rgba(0,0,0,0.55); padding: 9px 12px;
      border-radius: 10px; font-size: 12px; line-height: 1.4; max-width: 230px;
      display: none;
    }
    #video {
      position: absolute; bottom: 10px; right: 10px;
      width: 120px; height: 90px; border: 2px solid #fff;
      border-radius: 8px; z-index: 5; transform: scaleX(-1); display: none; object-fit: cover;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Monke · BlenderTrack style</h1>
    <p>Tap to allow Motion + Camera.<br>Then tilt to look & wave hands to move.</p>
    <button id="startBtn">Tap to Start</button>
    <div id="status"></div>
  </div>

  <div id="info">
    <b>BlenderTrack-ish</b><br>
    • Tilt = smooth look<br>
    • Hands = body + arms follow<br>
    • Touch drag = look backup<br>
    • 1 / 3 = 1st / 3rd person
  </div>

  <video id="video" playsinline muted></video>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script>
    const ui = document.getElementById('ui');
    const startBtn = document.getElementById('startBtn');
    const status = document.getElementById('status');
    const info = document.getElementById('info');
    const videoElement = document.getElementById('video');

    // Three
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x555555));
    const dir = new THREE.DirectionalLight(0xffffff, 1.15);
    dir.position.set(5, 12, 8);
    scene.add(dir);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshLambertMaterial({ color: 0x228B22 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Simple monke body (your OBJ is very large / different scale – using this for reliability while tracking is solid)
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
    const body = new THREE.Mesh(new THREE.SphereGeometry(1.1, 16, 16), bodyMat);
    body.position.y = 1.5;
    scene.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.65, 12, 12), new THREE.MeshLambertMaterial({ color: 0xA0522D }));
    head.position.set(0, 2.45, 0);
    scene.add(head);

    const armGeo = new THREE.CylinderGeometry(0.18, 0.18, 1.4);
    const leftArm = new THREE.Mesh(armGeo, bodyMat);
    leftArm.position.set(-1.25, 1.7, 0);
    scene.add(leftArm);
    const rightArm = new THREE.Mesh(armGeo, bodyMat);
    rightArm.position.set(1.25, 1.7, 0);
    scene.add(rightArm);

    // Smooth tracking state (BlenderTrack style)
    let yaw = 0, pitch = 0.12;
    let targetYaw = 0, targetPitch = 0.12;
    let firstPerson = false;
    let orientEnabled = false;
    let baseAlpha = null, baseBeta = null;

    let targetX = 0, targetZ = 0;
    let smoothX = 0, smoothZ = 0;
    let velY = 0;
    let leftHand = new THREE.Vector3(-0.3, 0.5, 0);
    let rightHand = new THREE.Vector3(0.3, 0.5, 0);

    function onOrient(e) {
      if (!orientEnabled || e.alpha == null) return;
      if (baseAlpha === null) {
        baseAlpha = e.alpha;
        baseBeta = e.beta;
      }
      targetYaw = -(e.alpha - baseAlpha) * Math.PI / 180;
      targetPitch = THREE.MathUtils.clamp(-(e.beta - baseBeta) * Math.PI / 180 * 0.6, -1.1, 1.1);
    }

    // Touch backup
    let dragging = false, lx = 0, ly = 0;
    function startD(x, y) { dragging = true; lx = x; ly = y; }
    function moveD(x, y) {
      if (!dragging) return;
      targetYaw -= (x - lx) * 0.004;
      targetPitch = THREE.MathUtils.clamp(targetPitch - (y - ly) * 0.004, -1.1, 1.1);
      lx = x; ly = y;
    }
    function endD() { dragging = false; }

    window.addEventListener('touchstart', e => { e.preventDefault(); startD(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
    window.addEventListener('touchmove', e => { e.preventDefault(); moveD(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
    window.addEventListener('touchend', endD);
    window.addEventListener('mousedown', e => startD(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => moveD(e.clientX, e.clientY));
    window.addEventListener('mouseup', endD);

    window.addEventListener('keydown', e => {
      if (e.key === '1') firstPerson = true;
      if (e.key === '3') firstPerson = false;
    });

    function onResults(results) {
      if (!results.multiHandLandmarks || !results.multiHandLandmarks.length) return;

      let ax = 0, ay = 0, n = 0;
      let hasLeft = false, hasRight = false;

      for (let i = 0; i < results.multiHandLandmarks.length; i++) {
        const lm = results.multiHandLandmarks[i];
        const handedness = results.multiHandedness?.[i]?.label || 'Right';
        const wx = 1 - lm[0].x;
        const wy = lm[0].y;

        ax += wx; ay += wy; n++;

        // Approximate hand world positions relative to body
        const hx = (wx - 0.5) * 2.2;
        const hy = (0.6 - wy) * 1.8 + 0.3;
        const hz = (lm[0].z || 0) * -1.5;

        if (handedness === 'Left') {
          leftHand.set(hx, hy, hz);
          hasLeft = true;
        } else {
          rightHand.set(hx, hy, hz);
          hasRight = true;
        }
      }

      if (n > 0) {
        ax /= n; ay /= n;
        targetX = (ax - 0.5) * 12;
        targetZ = (ay - 0.5) * 10;
      }
    }

    const hands = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.55, minTrackingConfidence: 0.5 });
    hands.onResults(onResults);

    startBtn.addEventListener('click', async () => {
      status.textContent = 'Requesting…';
      startBtn.disabled = true;
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res === 'granted') {
            window.addEventListener('deviceorientation', onOrient, true);
            orientEnabled = true;
          }
        } else {
          window.addEventListener('deviceorientation', onOrient, true);
          orientEnabled = true;
        }

        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        videoElement.srcObject = stream;
        videoElement.style.display = 'block';
        await videoElement.play();

        const cam = new Camera(videoElement, {
          onFrame: async () => { await hands.send({ image: videoElement }); },
          width: 640, height: 480
        });
        cam.start();

        status.textContent = 'Ready!';
        setTimeout(() => { ui.style.display = 'none'; info.style.display = 'block'; }, 350);
      } catch (err) {
        status.textContent = 'Error: ' + (err.message || err);
        startBtn.disabled = false;
        startBtn.textContent = 'Try Again';
      }
    });

    function animate() {
      requestAnimationFrame(animate);

      // Smooth camera look (BlenderTrack-ish)
      yaw += (targetYaw - yaw) * 0.12;
      pitch += (targetPitch - pitch) * 0.12;

      // Smooth body position
      smoothX += (targetX - smoothX) * 0.11;
      smoothZ += (targetZ - smoothZ) * 0.11;
      body.position.x = smoothX;
      body.position.z = smoothZ;

      velY -= 0.015;
      body.position.y += velY;
      if (body.position.y < 1.5) { body.position.y = 1.5; velY = 0; }

      head.position.set(body.position.x, body.position.y + 0.95, body.position.z);

      // Arms try to point toward tracked hands (simple look-at style)
      const shoulderL = new THREE.Vector3(body.position.x - 0.7, body.position.y + 0.6, body.position.z);
      const shoulderR = new THREE.Vector3(body.position.x + 0.7, body.position.y + 0.6, body.position.z);

      const targetL = new THREE.Vector3(
        body.position.x + leftHand.x * 1.4,
        body.position.y + leftHand.y * 1.1,
        body.position.z + leftHand.z
      );
      const targetR = new THREE.Vector3(
        body.position.x + rightHand.x * 1.4,
        body.position.y + rightHand.y * 1.1,
        body.position.z + rightHand.z
      );

      leftArm.position.lerp(shoulderL.clone().lerp(targetL, 0.45), 0.2);
      rightArm.position.lerp(shoulderR.clone().lerp(targetR, 0.45), 0.2);

      leftArm.lookAt(targetL);
      rightArm.lookAt(targetR);
      leftArm.rotateX(Math.PI / 2);
      rightArm.rotateX(Math.PI / 2);

      // Camera
      if (firstPerson) {
        camera.position.set(body.position.x, body.position.y + 1.5, body.position.z);
        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
      } else {
        const d = 7.2;
        camera.position.x = body.position.x + Math.sin(yaw) * d * Math.cos(pitch);
        camera.position.z = body.position.z + Math.cos(yaw) * d * Math.cos(pitch);
        camera.position.y = body.position.y + 2.6 + Math.sin(pitch) * 2.2;
        camera.lookAt(body.position.x, body.position.y + 1.2, body.position.z);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>

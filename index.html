<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monke Hand Tracking Playground nya~</title>
  <style>
    body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Comic Sans MS', cursive; }
    #info {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      color: white; background: rgba(0,0,0,0.6); padding: 12px 16px;
      border-radius: 12px; max-width: 320px; line-height: 1.4;
    }
    #video {
      position: absolute; bottom: 10px; right: 10px;
      width: 240px; height: 180px; border: 3px solid #fff;
      border-radius: 12px; z-index: 5; transform: scaleX(-1);
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="info">
    <b>Nyaaa~ Monke Hand Tracking!</b><br>
    • Allow camera access<br>
    • Move your hand left/right/up/down to move the monke<br>
    • Open/close hand (pinch) to jump a little<br>
    • Mouse drag still works for looking around too<br>
    Made with MediaPipe + Three.js 🐱
  </div>
  <video id="video" autoplay playsinline muted></video>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script>
    // ============ THREE.JS SCENE ============
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Lights
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(5, 12, 8);
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0x606060));

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshLambertMaterial({ color: 0x228B22 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Simple monke (body + head + arms)
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
    const body = new THREE.Mesh(new THREE.SphereGeometry(1.1, 16, 16), bodyMat);
    body.position.y = 1.4;
    scene.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.65, 12, 12), new THREE.MeshLambertMaterial({ color: 0xA0522D }));
    head.position.set(0, 2.4, 0);
    scene.add(head);

    const armGeo = new THREE.CylinderGeometry(0.18, 0.18, 1.4);
    const leftArm = new THREE.Mesh(armGeo, bodyMat);
    leftArm.position.set(-1.2, 1.6, 0);
    leftArm.rotation.z = 0.6;
    scene.add(leftArm);
    const rightArm = new THREE.Mesh(armGeo, bodyMat);
    rightArm.position.set(1.2, 1.6, 0);
    rightArm.rotation.z = -0.6;
    scene.add(rightArm);

    // Camera controls (mouse look)
    let yaw = 0, pitch = 0.2;
    let mouseDown = false, lastX = 0, lastY = 0;
    document.addEventListener('mousedown', e => { mouseDown = true; lastX = e.clientX; lastY = e.clientY; });
    document.addEventListener('mouseup', () => mouseDown = false);
    document.addEventListener('mousemove', e => {
      if (!mouseDown) return;
      yaw -= (e.clientX - lastX) * 0.004;
      pitch -= (e.clientY - lastY) * 0.004;
      pitch = Math.max(-0.9, Math.min(1.1, pitch));
      lastX = e.clientX; lastY = e.clientY;
    });

    // Monke position target from hands
    let targetX = 0, targetZ = 0, targetY = 1.4;
    let velocityY = 0;

    // ============ MEDIAPIPE HANDS ============
    const videoElement = document.getElementById('video');
    let lastHandX = 0.5, lastHandY = 0.5;
    let isPinching = false;

    function onResults(results) {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        // Wrist is landmark 0, index tip 8, thumb tip 4
        const wrist = landmarks[0];
        const indexTip = landmarks[8];
        const thumbTip = landmarks[4];

        // Hand position (mirrored because video is flipped)
        const handX = 1 - wrist.x; // 0 left, 1 right
        const handY = wrist.y;     // 0 top, 1 bottom

        // Map hand to world coords
        targetX = (handX - 0.5) * 12;
        targetZ = (handY - 0.5) * 10;

        // Simple pinch detection (distance between thumb & index)
        const dx = indexTip.x - thumbTip.x;
        const dy = indexTip.y - thumbTip.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        isPinching = dist < 0.05;

        if (isPinching && body.position.y < 1.6) {
          velocityY = 0.25; // little jump
        }

        lastHandX = handX;
        lastHandY = handY;
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    cameraUtils.start();

    // ============ ANIMATION LOOP ============
    function animate() {
      requestAnimationFrame(animate);

      // Smooth monke follow hand
      body.position.x += (targetX - body.position.x) * 0.12;
      body.position.z += (targetZ - body.position.z) * 0.12;

      // Gravity + jump
      velocityY -= 0.012;
      body.position.y += velocityY;
      if (body.position.y < 1.4) {
        body.position.y = 1.4;
        velocityY = 0;
      }

      // Update head & arms
      head.position.set(body.position.x, body.position.y + 1.0, body.position.z);
      leftArm.position.set(body.position.x - 1.2, body.position.y + 0.2, body.position.z);
      rightArm.position.set(body.position.x + 1.2, body.position.y + 0.2, body.position.z);

      // Silly arm swing based on movement
      const swing = Math.sin(Date.now() * 0.008) * 0.4;
      leftArm.rotation.z = 0.6 + swing;
      rightArm.rotation.z = -0.6 - swing;

      // Camera follow + mouse look
      const camDist = 7;
      camera.position.x = body.position.x + Math.sin(yaw) * camDist * Math.cos(pitch);
      camera.position.z = body.position.z + Math.cos(yaw) * camDist * Math.cos(pitch);
      camera.position.y = body.position.y + 2.5 + Math.sin(pitch) * 3;
      camera.lookAt(body.position.x, body.position.y + 1.2, body.position.z);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

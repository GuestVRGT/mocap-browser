<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Monke Hand + Device Orientation</title>
  <style>
    body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Comic Sans MS', cursive; touch-action: none; }
    #info {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      color: white; background: rgba(0,0,0,0.65); padding: 12px 16px;
      border-radius: 12px; max-width: 300px; line-height: 1.4; font-size: 14px;
    }
    #video {
      position: absolute; bottom: 10px; right: 10px;
      width: 160px; height: 120px; border: 2px solid #fff;
      border-radius: 10px; z-index: 5; transform: scaleX(-1);
    }
    #permBtn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 16px 28px; font-size: 18px; border: none; border-radius: 12px;
      background: #4cbf56; color: white; z-index: 20; cursor: pointer;
      font-family: 'Comic Sans MS', cursive;
    }
  </style>
</head>
<body>
  <div id="info">
    <b>Monke Playground</b><br>
    • Allow Camera + Motion<br>
    • Tilt your iPhone/iPad to look around<br>
    • Move hands in front of camera to swing the monke<br>
    • Touch drag also works for looking<br>
    Press 1 = First Person • 3 = Third Person
  </div>
  <button id="permBtn">Tap to Start (Camera + Motion)</button>
  <video id="video" autoplay playsinline muted></video>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script>
    // ============ SCENE ============
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1.1);
    light.position.set(5, 12, 8);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x555555));

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(50, 50),
      new THREE.MeshLambertMaterial({ color: 0x228B22 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Simple monke body
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
    const body = new THREE.Mesh(new THREE.SphereGeometry(1.15, 16, 16), bodyMat);
    body.position.y = 1.5;
    scene.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 12), new THREE.MeshLambertMaterial({ color: 0xA0522D }));
    head.position.set(0, 2.5, 0);
    scene.add(head);

    const armGeo = new THREE.CylinderGeometry(0.2, 0.2, 1.5);
    const leftArm = new THREE.Mesh(armGeo, bodyMat);
    leftArm.position.set(-1.3, 1.7, 0);
    scene.add(leftArm);
    const rightArm = new THREE.Mesh(armGeo, bodyMat);
    rightArm.position.set(1.3, 1.7, 0);
    scene.add(rightArm);

    // ============ LOOK CONTROLS ============
    let yaw = 0, pitch = 0.15;
    let firstPerson = false;
    let orientEnabled = false;
    let baseAlpha = null, baseBeta = null, baseGamma = null;

    // Device Orientation (the important part for iPhone/iPad)
    function handleOrientation(e) {
      if (!orientEnabled) return;
      if (e.alpha === null || e.beta === null || e.gamma === null) return;

      if (baseAlpha === null) {
        baseAlpha = e.alpha;
        baseBeta = e.beta;
        baseGamma = e.gamma;
      }

      // Relative movement so it feels natural
      const dAlpha = e.alpha - baseAlpha;
      const dBeta  = e.beta  - baseBeta;

      yaw   = -dAlpha * Math.PI / 180;
      pitch = THREE.MathUtils.clamp((-dBeta * Math.PI / 180) * 0.7, -1.1, 1.1);
    }

    // Touch / mouse drag backup
    let dragging = false, lastX = 0, lastY = 0;
    function startDrag(x, y) { dragging = true; lastX = x; lastY = y; }
    function moveDrag(x, y) {
      if (!dragging) return;
      yaw   -= (x - lastX) * 0.004;
      pitch -= (y - lastY) * 0.004;
      pitch = THREE.MathUtils.clamp(pitch, -1.1, 1.1);
      lastX = x; lastY = y;
    }
    function endDrag() { dragging = false; }

    window.addEventListener('touchstart', e => { e.preventDefault(); startDrag(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
    window.addEventListener('touchmove',  e => { e.preventDefault(); moveDrag(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
    window.addEventListener('touchend', endDrag);
    window.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);

    window.addEventListener('keydown', e => {
      if (e.key === '1') firstPerson = true;
      if (e.key === '3') firstPerson = false;
    });

    // ============ HAND TRACKING ============
    let targetX = 0, targetZ = 0;
    let velocityY = 0;
    let lastHandY = 0.5;

    function onResults(results) {
      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;

      // Average both hands if available, otherwise use first
      let avgX = 0, avgY = 0, count = 0;
      for (const landmarks of results.multiHandLandmarks) {
        const wrist = landmarks[0];
        avgX += (1 - wrist.x); // mirrored
        avgY += wrist.y;
        count++;
      }
      avgX /= count;
      avgY /= count;

      // Map to world
      targetX = (avgX - 0.5) * 14;
      targetZ = (avgY - 0.5) * 12;

      // Simple “push down” boost (GTag style)
      const dy = avgY - lastHandY;
      if (dy > 0.04) velocityY += dy * 1.8;
      lastHandY = avgY;
    }

    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.55,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    // ============ START BUTTON (needed for iOS permissions) ============
    const permBtn = document.getElementById('permBtn');
    const videoElement = document.getElementById('video');

    permBtn.addEventListener('click', async () => {
      permBtn.style.display = 'none';

      // Request Device Orientation (iOS needs a user gesture)
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            orientEnabled = true;
          }
        } catch (err) {
          console.warn('Orientation permission failed', err);
        }
      } else {
        // Android / desktop
        window.addEventListener('deviceorientation', handleOrientation);
        orientEnabled = true;
      }

      // Start camera + MediaPipe
      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 640,
        height: 480
      });
      cameraUtils.start();
    });

    // ============ ANIMATION ============
    function animate() {
      requestAnimationFrame(animate);

      // Smooth body follow
      body.position.x += (targetX - body.position.x) * 0.13;
      body.position.z += (targetZ - body.position.z) * 0.13;

      // Gravity
      velocityY -= 0.015;
      body.position.y += velocityY;
      if (body.position.y < 1.5) {
        body.position.y = 1.5;
        velocityY = 0;
      }

      // Update head + arms
      head.position.set(body.position.x, body.position.y + 1.0, body.position.z);
      leftArm.position.set(body.position.x - 1.3, body.position.y + 0.2, body.position.z);
      rightArm.position.set(body.position.x + 1.3, body.position.y + 0.2, body.position.z);

      // Silly arm swing
      const swing = Math.sin(Date.now() * 0.007) * 0.35;
      leftArm.rotation.z = 0.55 + swing;
      rightArm.rotation.z = -0.55 - swing;

      // Camera
      if (firstPerson) {
        camera.position.set(body.position.x, body.position.y + 1.6, body.position.z);
        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
      } else {
        const dist = 7.5;
        camera.position.x = body.position.x + Math.sin(yaw) * dist * Math.cos(pitch);
        camera.position.z = body.position.z + Math.cos(yaw) * dist * Math.cos(pitch);
        camera.position.y = body.position.y + 2.8 + Math.sin(pitch) * 2.5;
        camera.lookAt(body.position.x, body.position.y + 1.3, body.position.z);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

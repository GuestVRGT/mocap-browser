<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Monke Playground</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #111; font-family: -apple-system, BlinkMacSystemFont, sans-serif; touch-action: none; }
    #ui {
      position: absolute; inset: 0; z-index: 40;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.9); color: white; text-align: center; padding: 20px;
    }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { font-size: 14px; opacity: 0.85; margin: 0 0 18px; max-width: 300px; }
    button {
      display: block; width: 90%; max-width: 280px; margin: 10px auto;
      padding: 15px; font-size: 16px; border: none; border-radius: 12px;
      background: #4cbf56; color: white; font-weight: 600;
    }
    button:disabled { background: #555; }
    #status { margin-top: 14px; font-size: 13px; opacity: 0.8; min-height: 40px; }
    #info {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      color: white; background: rgba(0,0,0,0.55); padding: 9px 12px;
      border-radius: 10px; font-size: 12px; line-height: 1.4; max-width: 220px;
      display: none;
    }
    #video {
      position: absolute; bottom: 10px; right: 10px;
      width: 120px; height: 90px; border: 2px solid #fff;
      border-radius: 8px; z-index: 5; transform: scaleX(-1); display: none; object-fit: cover;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Monke Playground</h1>
    <p>Tap the two buttons one after another.<br>(The combined button is removed)</p>
    <button id="orientBtn">1. Allow Motion</button>
    <button id="camBtn" disabled>2. Allow Camera</button>
    <div id="status">Tap button 1 first</div>
  </div>

  <div id="info">
    <b>Controls</b><br>
    • Tilt = look<br>
    • Hands = move monke<br>
    • Touch drag = look backup<br>
    • 1 / 3 = 1st / 3rd person
  </div>

  <video id="video" playsinline muted></video>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script>
    const ui = document.getElementById('ui');
    const orientBtn = document.getElementById('orientBtn');
    const camBtn = document.getElementById('camBtn');
    const status = document.getElementById('status');
    const info = document.getElementById('info');
    const videoElement = document.getElementById('video');

    let motionOk = false;
    let cameraOk = false;

    // Three.js scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x555555));
    const dir = new THREE.DirectionalLight(0xffffff, 1.1);
    dir.position.set(5, 12, 8);
    scene.add(dir);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(50, 50),
      new THREE.MeshLambertMaterial({ color: 0x228B22 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
    const body = new THREE.Mesh(new THREE.SphereGeometry(1.1, 16, 16), bodyMat);
    body.position.y = 1.5;
    scene.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.65, 12, 12), new THREE.MeshLambertMaterial({ color: 0xA0522D }));
    head.position.set(0, 2.45, 0);
    scene.add(head);

    const armGeo = new THREE.CylinderGeometry(0.18, 0.18, 1.4);
    const leftArm = new THREE.Mesh(armGeo, bodyMat);
    leftArm.position.set(-1.25, 1.7, 0);
    scene.add(leftArm);
    const rightArm = new THREE.Mesh(armGeo, bodyMat);
    rightArm.position.set(1.25, 1.7, 0);
    scene.add(rightArm);

    // Look
    let yaw = 0, pitch = 0.12, firstPerson = false;
    let orientEnabled = false, baseAlpha = null, baseBeta = null;

    function onOrient(e) {
      if (!orientEnabled || e.alpha == null) return;
      if (baseAlpha === null) { baseAlpha = e.alpha; baseBeta = e.beta; }
      yaw = -(e.alpha - baseAlpha) * Math.PI / 180;
      pitch = THREE.MathUtils.clamp(-(e.beta - baseBeta) * Math.PI / 180 * 0.6, -1.1, 1.1);
    }

    // Touch backup
    let dragging = false, lx = 0, ly = 0;
    function startD(x, y) { dragging = true; lx = x; ly = y; }
    function moveD(x, y) {
      if (!dragging) return;
      yaw -= (x - lx) * 0.004;
      pitch = THREE.MathUtils.clamp(pitch - (y - ly) * 0.004, -1.1, 1.1);
      lx = x; ly = y;
    }
    function endD() { dragging = false; }

    window.addEventListener('touchstart', e => { e.preventDefault(); startD(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
    window.addEventListener('touchmove', e => { e.preventDefault(); moveD(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
    window.addEventListener('touchend', endD);
    window.addEventListener('mousedown', e => startD(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => moveD(e.clientX, e.clientY));
    window.addEventListener('mouseup', endD);

    window.addEventListener('keydown', e => {
      if (e.key === '1') firstPerson = true;
      if (e.key === '3') firstPerson = false;
    });

    // Hands
    let targetX = 0, targetZ = 0, velY = 0;

    function onResults(results) {
      if (!results.multiHandLandmarks || !results.multiHandLandmarks.length) return;
      let ax = 0, ay = 0, n = 0;
      for (const lm of results.multiHandLandmarks) {
        ax += (1 - lm[0].x);
        ay += lm[0].y;
        n++;
      }
      ax /= n; ay /= n;
      targetX = (ax - 0.5) * 12;
      targetZ = (ay - 0.5) * 10;
    }

    const hands = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.55, minTrackingConfidence: 0.5 });
    hands.onResults(onResults);

    // Button 1 – Motion only
    orientBtn.addEventListener('click', async () => {
      status.textContent = 'Requesting motion…';
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res === 'granted') {
            window.addEventListener('deviceorientation', onOrient, true);
            orientEnabled = true;
            motionOk = true;
            status.textContent = 'Motion allowed ✓  Now tap button 2';
            orientBtn.disabled = true;
            camBtn.disabled = false;
          } else {
            status.textContent = 'Motion denied. You can still use touch to look.';
            motionOk = true; // allow continuing
            orientBtn.disabled = true;
            camBtn.disabled = false;
          }
        } else {
          window.addEventListener('deviceorientation', onOrient, true);
          orientEnabled = true;
          motionOk = true;
          status.textContent = 'Motion enabled. Now tap button 2';
          orientBtn.disabled = true;
          camBtn.disabled = false;
        }
      } catch (err) {
        status.textContent = 'Motion error: ' + (err.message || err);
        // still allow camera
        motionOk = true;
        orientBtn.disabled = true;
        camBtn.disabled = false;
      }
    });

    // Button 2 – Camera only
    camBtn.addEventListener('click', async () => {
      status.textContent = 'Requesting camera…';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        videoElement.srcObject = stream;
        videoElement.style.display = 'block';
        await videoElement.play();

        const cam = new Camera(videoElement, {
          onFrame: async () => { await hands.send({ image: videoElement }); },
          width: 640, height: 480
        });
        cam.start();

        cameraOk = true;
        status.textContent = 'All ready!';
        setTimeout(() => {
          ui.style.display = 'none';
          info.style.display = 'block';
        }, 400);
      } catch (err) {
        status.textContent = 'Camera error: ' + (err.message || err);
        camBtn.disabled = false;
      }
    });

    function animate() {
      requestAnimationFrame(animate);

      body.position.x += (targetX - body.position.x) * 0.13;
      body.position.z += (targetZ - body.position.z) * 0.13;

      velY -= 0.015;
      body.position.y += velY;
      if (body.position.y < 1.5) { body.position.y = 1.5; velY = 0; }

      head.position.set(body.position.x, body.position.y + 0.95, body.position.z);
      leftArm.position.set(body.position.x - 1.25, body.position.y + 0.25, body.position.z);
      rightArm.position.set(body.position.x + 1.25, body.position.y + 0.25, body.position.z);

      const swing = Math.sin(Date.now() * 0.007) * 0.3;
      leftArm.rotation.z = 0.5 + swing;
      rightArm.rotation.z = -0.5 - swing;

      if (firstPerson) {
        camera.position.set(body.position.x, body.position.y + 1.5, body.position.z);
        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
      } else {
        const d = 7.2;
        camera.position.x = body.position.x + Math.sin(yaw) * d * Math.cos(pitch);
        camera.position.z = body.position.z + Math.cos(yaw) * d * Math.cos(pitch);
        camera.position.y = body.position.y + 2.6 + Math.sin(pitch) * 2.2;
        camera.lookAt(body.position.x, body.position.y + 1.2, body.position.z);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>

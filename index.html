<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Browser MonkeMocap 🐒</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background: #0d1117; color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #ui {
      position: absolute; top: 12px; left: 12px; z-index: 20;
      background: rgba(13,17,23,0.93); padding: 14px 16px;
      border-radius: 12px; border: 1px solid #30363d;
      max-width: 380px; font-size: 13px; line-height: 1.45;
    }
    #ui h1 { margin: 0 0 6px; font-size: 18px; color: #7ee787; }
    #ui p { margin: 0 0 10px; opacity: 0.85; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    button {
      padding: 8px 12px; border: none; border-radius: 8px;
      font-weight: 600; font-size: 12px; cursor: pointer;
    }
    button:active { transform: scale(0.96); }
    #recordBtn { background: #da3633; color: white; }
    #recordBtn.recording { background: #f85149; animation: pulse 1s infinite; }
    #stopBtn { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
    #downloadBody { background: #238636; color: white; }
    #downloadNonames { background: #1f6feb; color: white; }
    #downloadGltf { background: #8957e5; color: white; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
    #status { margin-top: 10px; font-size: 12px; color: #8b949e; }
    #video {
      position: absolute; bottom: 12px; right: 12px;
      width: 160px; height: 120px; border: 2px solid #30363d;
      border-radius: 10px; z-index: 10; transform: scaleX(-1);
      object-fit: cover; background: #000;
    }
    #canvas-container { width: 100vw; height: 100vh; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Browser MonkeMocap 🐒</h1>
    <p>Starts in default pose<br>
    Arms free • <b>Hands full 360°</b> • Torso left/right • Head up/down<br>
    + ground clamp</p>
    <div class="btn-row">
      <button id="recordBtn">● Record</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>
    <div class="btn-row">
      <button id="downloadBody" disabled>Body JSON</button>
      <button id="downloadNonames" disabled>Nonames JSON</button>
      <button id="downloadGltf" disabled>GLTF (cubes)</button>
    </div>
    <div id="status">Waiting for camera…</div>
  </div>

  <video id="video" playsinline muted></video>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 2.5, 6.2);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x555555));
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(5, 12, 7);
    scene.add(light);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshLambertMaterial({ color: 0x1a2332 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const grid = new THREE.GridHelper(20, 20, 0x30363d, 0x21262d);
    grid.position.y = 0.01;
    scene.add(grid);

    const torsoMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.4 });
    const headMat  = new THREE.MeshStandardMaterial({ color: 0xA0522D, roughness: 0.4 });
    const armMat   = new THREE.MeshStandardMaterial({ color: 0xCD853F, roughness: 0.4 });
    const handMat  = new THREE.MeshStandardMaterial({ color: 0xDEB887, roughness: 0.35 });

    function makeCube(w, h, d, mat, name) {
      const geo = new THREE.BoxGeometry(w, h, d);
      geo.translate(0, -h/2, 0);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.name = name;
      return mesh;
    }

    const previewTorso = makeCube(0.60, 0.95, 0.40, torsoMat, 'torso');
    const previewHead  = makeCube(0.42, 0.42, 0.42, headMat, 'head');
    const previewUpperL = makeCube(0.18, 0.50, 0.18, armMat, 'upper_arm.L');
    const previewForeL  = makeCube(0.16, 0.44, 0.16, armMat, 'forearm.L');
    const previewHandL  = makeCube(0.24, 0.18, 0.12, handMat, 'hand.L');
    const previewUpperR = makeCube(0.18, 0.50, 0.18, armMat, 'upper_arm.R');
    const previewForeR  = makeCube(0.16, 0.44, 0.16, armMat, 'forearm.R');
    const previewHandR  = makeCube(0.24, 0.18, 0.12, handMat, 'hand.R');

    const allCubes = [previewTorso, previewHead, previewUpperL, previewForeL, previewHandL, previewUpperR, previewForeR, previewHandR];
    allCubes.forEach(c => { scene.add(c); c.visible = false; });

    const REST = {
      torso:  new THREE.Vector3(0, 1.55, 0),
      head:   new THREE.Vector3(0, 2.35, 0),
      upperL: new THREE.Vector3(-0.55, 1.85, 0),
      foreL:  new THREE.Vector3(-0.95, 1.55, 0),
      handL:  new THREE.Vector3(-1.25, 1.30, 0),
      upperR: new THREE.Vector3( 0.55, 1.85, 0),
      foreR:  new THREE.Vector3( 0.95, 1.55, 0),
      handR:  new THREE.Vector3( 1.25, 1.30, 0)
    };

    let recording = false;
    let recordedFrames = [];
    let startTime = 0;

    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBody = document.getElementById('downloadBody');
    const downloadNonames = document.getElementById('downloadNonames');
    const downloadGltf = document.getElementById('downloadGltf');
    const statusEl = document.getElementById('status');

    recordBtn.addEventListener('click', () => {
      recording = true;
      recordedFrames = [];
      startTime = performance.now();
      recordBtn.classList.add('recording');
      recordBtn.textContent = '● Recording…';
      recordBtn.disabled = true;
      stopBtn.disabled = false;
      downloadBody.disabled = true;
      downloadNonames.disabled = true;
      downloadGltf.disabled = true;
      statusEl.textContent = 'Recording… move around!';
    });

    stopBtn.addEventListener('click', () => {
      recording = false;
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '● Record';
      recordBtn.disabled = false;
      stopBtn.disabled = true;
      const has = recordedFrames.length > 0;
      downloadBody.disabled = !has;
      downloadNonames.disabled = !has;
      downloadGltf.disabled = !has;
      statusEl.textContent = `Stopped. ${recordedFrames.length} frames.`;
    });

    downloadBody.addEventListener('click', () => {
      const payload = {
        version: 1,
        type: 'mediapipe-pose',
        frameCount: recordedFrames.length,
        recordedAt: new Date().toISOString(),
        frames: recordedFrames
      };
      downloadJSON(payload, `monke-body-${Date.now()}.json`);
      statusEl.textContent = 'Body pose JSON downloaded.';
    });

    downloadNonames.addEventListener('click', () => {
      const cameraPoseList = recordedFrames.map((frame, i) => {
        const nose = frame.landmarks[0] || { x: 0.5, y: 0.5, z: 0 };
        return {
          frame: i,
          time: frame.t,
          position: { x: (nose.x-0.5)*2, y: (0.5-nose.y)*1.5+1.5, z: -nose.z*3-2.5 },
          rotation: { x: (nose.y-0.5)*0.5, y: (nose.x-0.5)*0.8, z: 0 }
        };
      });
      downloadJSON({ cameraPoseList, bodyPoseFrames: recordedFrames, version: 1 }, `monke-nonames-${Date.now()}.json`);
      statusEl.textContent = 'Nonames JSON downloaded.';
    });

    function lmToPos(lm) {
      return new THREE.Vector3(
        (lm.x - 0.5) * 2.8,
        (0.5 - lm.y) * 2.8 + 0.3,
        -lm.z * 1.8
      );
    }

    // Free lookAt that allows full 360° (no preferred up lock for hands)
    function freeLookAtQuat(from, to) {
      const dir = new THREE.Vector3().subVectors(to, from).normalize();
      if (dir.lengthSq() < 0.0001) return new THREE.Quaternion();
      const quat = new THREE.Quaternion();
      // Use a more flexible basis so hands can spin freely in all directions
      const up = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
      const m = new THREE.Matrix4();
      m.lookAt(new THREE.Vector3(), dir, up);
      quat.setFromRotationMatrix(m);
      return quat;
    }

    function lookAtQuat(from, to) {
      const dir = new THREE.Vector3().subVectors(to, from).normalize();
      const quat = new THREE.Quaternion();
      quat.setFromUnitVectors(new THREE.Vector3(0, -1, 0), dir);
      return quat;
    }

    function applyGroundClamp(pos) {
      const bottoms = [
        pos.upperL.y - 0.25, pos.foreL.y - 0.22, pos.handL.y - 0.09,
        pos.upperR.y - 0.25, pos.foreR.y - 0.22, pos.handR.y - 0.09
      ];
      let lift = 0;
      const lowest = Math.min(...bottoms);
      if (lowest < 0) lift = -lowest;

      const torsoBottom = pos.torso.y - 0.48;
      if (torsoBottom + lift < 0.05) lift = Math.max(lift, -torsoBottom + 0.05);

      Object.keys(pos).forEach(k => { if (pos[k].isVector3) pos[k].y += lift; });
      return lift;
    }

    function computePose(landmarks) {
      const lS = lmToPos(landmarks[11] || {x:0.42,y:0.40,z:0});
      const rS = lmToPos(landmarks[12] || {x:0.58,y:0.40,z:0});
      const lE = lmToPos(landmarks[13] || {x:0.38,y:0.55,z:0});
      const rE = lmToPos(landmarks[14] || {x:0.62,y:0.55,z:0});
      const lW = lmToPos(landmarks[15] || {x:0.32,y:0.70,z:0});
      const rW = lmToPos(landmarks[16] || {x:0.68,y:0.70,z:0});
      const nose = lmToPos(landmarks[0] || {x:0.50,y:0.28,z:0});

      const torsoPos = new THREE.Vector3().addVectors(lS, rS).multiplyScalar(0.5);
      torsoPos.y -= 0.35;

      const shoulderDir = new THREE.Vector3().subVectors(rS, lS).normalize();
      const torsoYaw = Math.atan2(shoulderDir.x, shoulderDir.z);
      const torsoQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, torsoYaw, 0));

      const headPos = nose.clone();
      headPos.y += 0.15;
      const neckToHead = new THREE.Vector3().subVectors(headPos, torsoPos).normalize();
      const headPitch = Math.asin(Math.max(-1, Math.min(1, -neckToHead.y))) * 0.7;
      const headQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(headPitch, torsoYaw, 0));

      // Arms
      const upperLPos = new THREE.Vector3().addVectors(lS, lE).multiplyScalar(0.5);
      const upperLQuat = lookAtQuat(lS, lE);

      const foreLPos = new THREE.Vector3().addVectors(lE, lW).multiplyScalar(0.5);
      const foreLQuat = lookAtQuat(lE, lW);

      // Hands - FULL free 360° rotation
      const handLPos = lW.clone();
      const handLQuat = freeLookAtQuat(lE, lW);

      const upperRPos = new THREE.Vector3().addVectors(rS, rE).multiplyScalar(0.5);
      const upperRQuat = lookAtQuat(rS, rE);

      const foreRPos = new THREE.Vector3().addVectors(rE, rW).multiplyScalar(0.5);
      const foreRQuat = lookAtQuat(rE, rW);

      const handRPos = rW.clone();
      const handRQuat = freeLookAtQuat(rE, rW);

      const result = {
        torso: { pos: torsoPos, quat: torsoQuat },
        head:  { pos: headPos,  quat: headQuat },
        upperL:{ pos: upperLPos, quat: upperLQuat },
        foreL: { pos: foreLPos,  quat: foreLQuat },
        handL: { pos: handLPos,  quat: handLQuat },
        upperR:{ pos: upperRPos, quat: upperRQuat },
        foreR: { pos: foreRPos,  quat: foreRQuat },
        handR: { pos: handRPos,  quat: handRQuat }
      };

      const posOnly = {
        torso: result.torso.pos, head: result.head.pos,
        upperL: result.upperL.pos, foreL: result.foreL.pos, handL: result.handL.pos,
        upperR: result.upperR.pos, foreR: result.foreR.pos, handR: result.handR.pos
      };
      applyGroundClamp(posOnly);

      return result;
    }

    function updatePreview(pose) {
      previewTorso.position.copy(pose.torso.pos);
      previewTorso.quaternion.copy(pose.torso.quat);

      previewHead.position.copy(pose.head.pos);
      previewHead.quaternion.copy(pose.head.quat);

      previewUpperL.position.copy(pose.upperL.pos);
      previewUpperL.quaternion.copy(pose.upperL.quat);

      previewForeL.position.copy(pose.foreL.pos);
      previewForeL.quaternion.copy(pose.foreL.quat);

      previewHandL.position.copy(pose.handL.pos);
      previewHandL.quaternion.copy(pose.handL.quat);

      previewUpperR.position.copy(pose.upperR.pos);
      previewUpperR.quaternion.copy(pose.upperR.quat);

      previewForeR.position.copy(pose.foreR.pos);
      previewForeR.quaternion.copy(pose.foreR.quat);

      previewHandR.position.copy(pose.handR.pos);
      previewHandR.quaternion.copy(pose.handR.quat);

      allCubes.forEach(c => c.visible = true);
    }

    downloadGltf.addEventListener('click', () => {
      if (recordedFrames.length === 0) return;
      statusEl.textContent = 'Building GLTF with full hand rotation…';

      const exportScene = new THREE.Scene();

      const torso = makeCube(0.60, 0.95, 0.40, torsoMat.clone(), 'torso');
      const head  = makeCube(0.42, 0.42, 0.42, headMat.clone(), 'head');
      const upperL = makeCube(0.18, 0.50, 0.18, armMat.clone(), 'upper_arm.L');
      const foreL  = makeCube(0.16, 0.44, 0.16, armMat.clone(), 'forearm.L');
      const handL  = makeCube(0.24, 0.18, 0.12, handMat.clone(), 'hand.L');
      const upperR = makeCube(0.18, 0.50, 0.18, armMat.clone(), 'upper_arm.R');
      const foreR  = makeCube(0.16, 0.44, 0.16, armMat.clone(), 'forearm.R');
      const handR  = makeCube(0.24, 0.18, 0.12, handMat.clone(), 'hand.R');

      [torso, head, upperL, foreL, handL, upperR, foreR, handR].forEach(c => exportScene.add(c));

      const times = [0, ...recordedFrames.map(f => f.t + 0.05)];
      const duration = times[times.length - 1] || 1;

      function makeTracks(name, getterPos, getterQuat) {
        const posValues = [];
        const quatValues = [];

        const restPos = REST[name === 'torso' ? 'torso' :
                            name === 'head' ? 'head' :
                            name === 'upper_arm.L' ? 'upperL' :
                            name === 'forearm.L' ? 'foreL' :
                            name === 'hand.L' ? 'handL' :
                            name === 'upper_arm.R' ? 'upperR' :
                            name === 'forearm.R' ? 'foreR' : 'handR'];
        posValues.push(restPos.x, restPos.y, restPos.z);
        quatValues.push(0, 0, 0, 1);

        recordedFrames.forEach(frame => {
          const pose = computePose(frame.landmarks);
          const p = getterPos(pose);
          const q = getterQuat(pose);
          posValues.push(p.x, p.y, p.z);
          quatValues.push(q.x, q.y, q.z, q.w);
        });

        return [
          new THREE.VectorKeyframeTrack(name + '.position', times, posValues),
          new THREE.QuaternionKeyframeTrack(name + '.quaternion', times, quatValues)
        ];
      }

      const tracks = [
        ...makeTracks('torso', p => p.torso.pos, p => p.torso.quat),
        ...makeTracks('head',  p => p.head.pos,  p => p.head.quat),
        ...makeTracks('upper_arm.L', p => p.upperL.pos, p => p.upperL.quat),
        ...makeTracks('forearm.L',  p => p.foreL.pos,  p => p.foreL.quat),
        ...makeTracks('hand.L',     p => p.handL.pos,  p => p.handL.quat),
        ...makeTracks('upper_arm.R', p => p.upperR.pos, p => p.upperR.quat),
        ...makeTracks('forearm.R',  p => p.foreR.pos,  p => p.foreR.quat),
        ...makeTracks('hand.R',     p => p.handR.pos,  p => p.handR.quat)
      ];

      const clip = new THREE.AnimationClip('MonkeRotations', duration, tracks);

      const exporter = new THREE.GLTFExporter();
      exporter.parse(
        exportScene,
        (result) => {
          const blob = new Blob([JSON.stringify(result)], { type: 'model/gltf+json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `monke-hands360-${Date.now()}.gltf`;
          a.click();
          URL.revokeObjectURL(url);
          statusEl.textContent = 'GLTF downloaded! Hands now rotate full 360° in every direction.';
        },
        { animations: [clip], binary: false }
      );
    });

    function downloadJSON(obj, filename) {
      const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    const videoElement = document.getElementById('video');

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults((results) => {
      if (!results.poseLandmarks) {
        allCubes.forEach(c => c.visible = false);
        return;
      }

      const p = computePose(results.poseLandmarks);
      updatePreview(p);

      if (recording) {
        const t = (performance.now() - startTime) / 1000;
        recordedFrames.push({
          t,
          landmarks: results.poseLandmarks.map(lm => ({
            x: lm.x, y: lm.y, z: lm.z, visibility: lm.visibility
          }))
        });
        if (recordedFrames.length % 30 === 0) {
          statusEl.textContent = `Recording… ${recordedFrames.length} frames`;
        }
      }
    });

    async function start() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 640, height: 480 },
          audio: false
        });
        videoElement.srcObject = stream;
        await videoElement.play();

        const cam = new Camera(videoElement, {
          onFrame: async () => { await pose.send({ image: videoElement }); },
          width: 640, height: 480
        });
        cam.start();
        statusEl.textContent = 'Camera ready! Hands now have full 360° rotation.';
      } catch (err) {
        statusEl.textContent = 'Camera error: ' + err.message;
      }
    }
    start();

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>

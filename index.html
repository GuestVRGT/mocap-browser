<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Monke Hand + Orientation</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #111; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; touch-action: none; }
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 30; background: rgba(0,0,0,0.85); color: white; text-align: center; padding: 20px;
    }
    #ui h1 { font-size: 28px; margin-bottom: 12px; }
    #ui p { font-size: 16px; opacity: 0.85; margin-bottom: 24px; max-width: 320px; }
    #startBtn {
      padding: 18px 36px; font-size: 20px; border: none; border-radius: 14px;
      background: #4cbf56; color: white; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 20px rgba(76,191,86,0.4);
    }
    #startBtn:active { transform: scale(0.97); }
    #status { margin-top: 18px; font-size: 14px; opacity: 0.7; min-height: 20px; }
    #info {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      color: white; background: rgba(0,0,0,0.6); padding: 10px 14px;
      border-radius: 10px; font-size: 13px; line-height: 1.4; max-width: 260px;
      display: none;
    }
    #video {
      position: absolute; bottom: 12px; right: 12px;
      width: 140px; height: 105px; border: 2px solid #fff;
      border-radius: 8px; z-index: 5; transform: scaleX(-1); display: none;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Monke Playground</h1>
    <p>This needs Camera + Motion sensors.<br>Tap the button below — Safari will ask for permission.</p>
    <button id="startBtn">Tap to Allow Camera & Motion</button>
    <div id="status"></div>
  </div>

  <div id="info">
    <b>Controls</b><br>
    • Tilt device = look around<br>
    • Move hands in front of camera = swing monke<br>
    • Touch drag = look (backup)<br>
    • Key 1 = First Person<br>
    • Key 3 = Third Person
  </div>

  <video id="video" playsinline muted></video>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script>
    const ui = document.getElementById('ui');
    const startBtn = document.getElementById('startBtn');
    const status = document.getElementById('status');
    const info = document.getElementById('info');
    const videoElement = document.getElementById('video');

    // ============ THREE SETUP ============
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x555555));
    const dir = new THREE.DirectionalLight(0xffffff, 1.1);
    dir.position.set(5, 12, 8);
    scene.add(dir);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(50, 50),
      new THREE.MeshLambertMaterial({ color: 0x228B22 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Simple monke (model swap coming next)
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
    const body = new THREE.Mesh(new THREE.SphereGeometry(1.15, 16, 16), bodyMat);
    body.position.y = 1.5;
    scene.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 12), new THREE.MeshLambertMaterial({ color: 0xA0522D }));
    head.position.set(0, 2.5, 0);
    scene.add(head);

    const armGeo = new THREE.CylinderGeometry(0.2, 0.2, 1.5);
    const leftArm = new THREE.Mesh(armGeo, bodyMat);
    leftArm.position.set(-1.3, 1.7, 0);
    scene.add(leftArm);
    const rightArm = new THREE.Mesh(armGeo, bodyMat);
    rightArm.position.set(1.3, 1.7, 0);
    scene.add(rightArm);

    // ============ LOOK ============
    let yaw = 0, pitch = 0.15;
    let firstPerson = false;
    let orientEnabled = false;
    let baseAlpha = null, baseBeta = null;

    function onOrient(e) {
      if (!orientEnabled || e.alpha == null) return;
      if (baseAlpha === null) {
        baseAlpha = e.alpha;
        baseBeta = e.beta;
      }
      const dA = e.alpha - baseAlpha;
      const dB = e.beta - baseBeta;
      yaw = -dA * Math.PI / 180;
      pitch = THREE.MathUtils.clamp(-dB * Math.PI / 180 * 0.65, -1.15, 1.15);
    }

    // Touch / mouse backup
    let dragging = false, lx = 0, ly = 0;
    function startD(x, y) { dragging = true; lx = x; ly = y; }
    function moveD(x, y) {
      if (!dragging) return;
      yaw -= (x - lx) * 0.0045;
      pitch = THREE.MathUtils.clamp(pitch - (y - ly) * 0.0045, -1.15, 1.15);
      lx = x; ly = y;
    }
    function endD() { dragging = false; }

    window.addEventListener('touchstart', e => { e.preventDefault(); startD(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
    window.addEventListener('touchmove', e => { e.preventDefault(); moveD(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
    window.addEventListener('touchend', endD);
    window.addEventListener('mousedown', e => startD(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => moveD(e.clientX, e.clientY));
    window.addEventListener('mouseup', endD);

    window.addEventListener('keydown', e => {
      if (e.key === '1') firstPerson = true;
      if (e.key === '3') firstPerson = false;
    });

    // ============ HANDS ============
    let targetX = 0, targetZ = 0, velY = 0, lastHY = 0.5;

    function onResults(results) {
      if (!results.multiHandLandmarks || !results.multiHandLandmarks.length) return;
      let ax = 0, ay = 0, n = 0;
      for (const lm of results.multiHandLandmarks) {
        ax += (1 - lm[0].x);
        ay += lm[0].y;
        n++;
      }
      ax /= n; ay /= n;
      targetX = (ax - 0.5) * 14;
      targetZ = (ay - 0.5) * 12;
      const dy = ay - lastHY;
      if (dy > 0.035) velY += dy * 1.6;
      lastHY = ay;
    }

    const hands = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.55, minTrackingConfidence: 0.5 });
    hands.onResults(onResults);

    // ============ THE IMPORTANT PERMISSION BUTTON ============
    startBtn.addEventListener('click', async () => {
      status.textContent = 'Requesting permissions…';
      startBtn.disabled = true;

      // 1. Device Orientation (iOS requires this exact pattern)
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const state = await DeviceOrientationEvent.requestPermission();
          if (state === 'granted') {
            window.addEventListener('deviceorientation', onOrient, true);
            orientEnabled = true;
            status.textContent = 'Motion: allowed ✓';
          } else {
            status.textContent = 'Motion permission denied. You can still use touch to look.';
          }
        } else {
          // Non-iOS
          window.addEventListener('deviceorientation', onOrient, true);
          orientEnabled = true;
          status.textContent = 'Motion: enabled';
        }
      } catch (err) {
        console.warn(err);
        status.textContent = 'Motion request failed — use touch to look.';
      }

      // 2. Camera
      try {
        status.textContent += ' • Starting camera…';
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        videoElement.srcObject = stream;
        videoElement.style.display = 'block';
        await videoElement.play();

        const cam = new Camera(videoElement, {
          onFrame: async () => { await hands.send({ image: videoElement }); },
          width: 640,
          height: 480
        });
        cam.start();

        status.textContent = 'All ready! Tilt + wave hands';
        setTimeout(() => {
          ui.style.display = 'none';
          info.style.display = 'block';
        }, 600);
      } catch (err) {
        console.error(err);
        status.textContent = 'Camera error: ' + (err.message || err);
        startBtn.disabled = false;
        startBtn.textContent = 'Try Again';
      }
    });

    // ============ LOOP ============
    function animate() {
      requestAnimationFrame(animate);

      body.position.x += (targetX - body.position.x) * 0.14;
      body.position.z += (targetZ - body.position.z) * 0.14;

      velY -= 0.016;
      body.position.y += velY;
      if (body.position.y < 1.5) { body.position.y = 1.5; velY = 0; }

      head.position.set(body.position.x, body.position.y + 1.0, body.position.z);
      leftArm.position.set(body.position.x - 1.3, body.position.y + 0.25, body.position.z);
      rightArm.position.set(body.position.x + 1.3, body.position.y + 0.25, body.position.z);

      const swing = Math.sin(Date.now() * 0.007) * 0.35;
      leftArm.rotation.z = 0.55 + swing;
      rightArm.rotation.z = -0.55 - swing;

      if (firstPerson) {
        camera.position.set(body.position.x, body.position.y + 1.55, body.position.z);
        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
      } else {
        const d = 7.5;
        camera.position.x = body.position.x + Math.sin(yaw) * d * Math.cos(pitch);
        camera.position.z = body.position.z + Math.cos(yaw) * d * Math.cos(pitch);
        camera.position.y = body.position.y + 2.8 + Math.sin(pitch) * 2.4;
        camera.lookAt(body.position.x, body.position.y + 1.3, body.position.z);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>

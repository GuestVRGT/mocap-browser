<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Permission Test</title>
  <style>
    body {
      margin: 0; padding: 20px; background: #111; color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { font-size: 14px; opacity: 0.8; margin-bottom: 24px; }
    button {
      display: block; width: 90%; max-width: 320px; margin: 14px auto;
      padding: 16px; font-size: 17px; border: none; border-radius: 12px;
      background: #4cbf56; color: white; font-weight: 600;
    }
    #log {
      margin-top: 28px; text-align: left; background: #222; padding: 14px;
      border-radius: 10px; font-size: 13px; white-space: pre-wrap;
      max-height: 45vh; overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>Permission Test</h1>
  <p>Tap the buttons one by one.<br>This is the version that worked before.</p>

  <button id="orientBtn">1. Request Motion</button>
  <button id="camBtn">2. Request Camera</button>
  <button id="bothBtn">3. Request Both</button>

  <div id="log">Waiting…</div>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += '\n' + msg;
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    document.getElementById('orientBtn').addEventListener('click', async () => {
      log('--- Motion tapped ---');
      try {
        if (typeof DeviceOrientationEvent === 'undefined') {
          log('DeviceOrientationEvent not supported');
          return;
        }
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          log('Calling requestPermission…');
          const result = await DeviceOrientationEvent.requestPermission();
          log('Result: ' + result);
          if (result === 'granted') {
            window.addEventListener('deviceorientation', e => {
              log('Got data α=' + (e.alpha?.toFixed(1) || '?'));
            });
          }
        } else {
          log('No requestPermission (not iOS?). Adding listener.');
          window.addEventListener('deviceorientation', e => {
            log('Got data α=' + (e.alpha?.toFixed(1) || '?'));
          });
        }
      } catch (err) {
        log('ERROR: ' + err.name + ' – ' + err.message);
      }
    });

    document.getElementById('camBtn').addEventListener('click', async () => {
      log('--- Camera tapped ---');
      try {
        log('Calling getUserMedia…');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        log('Camera granted!');
        stream.getTracks().forEach(t => t.stop());
      } catch (err) {
        log('ERROR: ' + err.name + ' – ' + err.message);
      }
    });

    document.getElementById('bothBtn').addEventListener('click', async () => {
      log('--- Both tapped ---');
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          log('Requesting motion…');
          const o = await DeviceOrientationEvent.requestPermission();
          log('Motion: ' + o);
        }
        log('Requesting camera…');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        log('Camera granted!');
        stream.getTracks().forEach(t => t.stop());
      } catch (err) {
        log('ERROR: ' + err.name + ' – ' + err.message);
      }
    });
  </script>
</body>
</html>

/* ---------- collision ---------- */
const _cp = new V3();

function newContact() {
  return { hit: false, depth: 0, n: new V3(), nn: new V3(), mu: 1, bounce: 0 };
}
function clearContact(c) {
  c.hit = false; c.depth = 0;
  c.n.set(0, 0, 0); c.nn.set(0, 0, 0);
  c.mu = 1; c.bounce = 0;
}
function finishContact(c) {
  if (c.hit && c.n.lengthSq() > 1e-10) c.nn.copy(c.n).normalize();
}

// pishes sphere p (radius r) out of every solid and records the contact
function resolve(p, r, c) {
  for (const b of solids) {
    _cp.set(
      THREE.MathUtils.clamp(p.x, b.min.x, b.max.x),
      THREE.MathUtils.clamp(p.y, b.min.y, b.max.y),
      THREE.MathUtils.clamp(p.z, b.min.z, b.max.z)
    );
    const dx = p.x - _cp.x, dy = p.y - _cp.y, dz = p.z - _cp.z;
    const d2 = dx * dx + dy * dy + dz * dz;
    if (d2 >= r * r) continue;

    let nx, ny, nz, depth;
    if (d2 > 1e-10) {
      const d = Math.sqrt(d2);
      nx = dx / d; ny = dy / d; nz = dz / d;
      depth = r - d;
    } else {
      // centre is inside the box: leave through the nearest face
      const lx = p.x - b.min.x, rx = b.max.x - p.x;
      const ly = p.y - b.min.y, ry = b.max.y - p.y;
      const lz = p.z - b.min.z, rz = b.max.z - p.z;
      const m = Math.min(lx, rx, ly, ry, lz, rz);
      nx = 0; ny = 0; nz = 0;
      if (m === lx)      { nx = -1; depth = lx + r; }
      else if (m === rx) { nx = 1;  depth = rx + r; }
      else if (m === ly) { ny = -1; depth = ly + r; }
      else if (m === ry) { ny = 1;  depth = ry + r; }
      else if (m === lz) { nz = -1; depth = lz + r; }
      else               { nz = 1;  depth = rz + r; }
    }

    p.x += nx * depth; p.y += ny * depth; p.z += nz * depth;
    c.hit = true;
    c.n.x += nx * depth; c.n.y += ny * depth; c.n.z += nz * depth;
    if (depth > c.depth) { c.depth = depth; c.mu = b.mu; c.bounce = b.bounce; }
  }
}

function buildHand(side) {
  const root = new THREE.Group();
  const palm = new THREE.Mesh(palmGeo, MAT.hand);
  palm.position.set(0, 0, -0.06);
  root.add(palm);
  const specs = [
    { x: -side * 0.038, z: -0.105, yaw: 0 },
    { x: 0,             z: -0.11,  yaw: 0 },
    { x: side * 0.058,  z: -0.07,  yaw: -side * 0.7 },
  ];
  const fingers = specs.map(s => {
    const r = new THREE.Group();
    r.rotation.order = 'YXZ';
    r.position.set(s.x, -0.005, s.z);
    const a = new THREE.Mesh(segA, MAT.hand);
    a.position.z = -0.029;
    r.add(a);
    const joint = new THREE.Group();
    joint.position.z = -0.058;
    r.add(joint);
    const b = new THREE.Mesh(segB, MAT.hand);
    b.position.z = -0.023;
    joint.add(b);
    root.add(r);
    return { root: r, joint, yaw: s.yaw };
  });
  scene.add(root);
  return { root, fingers };
}

/* ---------- meth helpers ---------- */
const _t1 = new V3(), _s = new V3(), _d = new V3(), _w = new V3(), _tmp = new V3(), _pr = new V3();
const _shL = new V3();   // shoulder line in rig space

function solveArm(sh, wr, pole, a1, a2) {
  const dir = new V3().subVectors(wr, sh);
  let d = dir.length();
  const maxD = (a1 + a2) * 0.999;
  if (d > maxD) { dir.setLength(maxD); d = maxD; }
  if (d < 1e-4) return sh.clone().addScaledVector(UP, -a1);
  dir.normalize();
  const a = (a1 * a1 - a2 * a2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, a1 * a1 - a * a));
  const base = sh.clone().addScaledVector(dir, a);
  const p = pole.clone().addScaledVector(dir, -pole.dot(dir));
  if (p.lengthSq() < 1e-6) p.copy(UP).negate();
  p.normalize();
  return base.addScaledVector(p, h);
}

function placeSegment(mesh, a, b) {
  const d = new V3().subVectors(b, a);
  const len = d.length();
  if (len < 1e-5) return;
  mesh.position.copy(a).addScaledVector(d, 0.5);
  mesh.quaternion.setFromUnitVectors(UP, d.normalize());
  mesh.scale.set(1, len, 1);
}

const _rotTmp = new Q();
function rotateRigAround(point, angle) {
  _rotTmp.setFromAxisAngle(UP, angle);
  rig.position.sub(point).applyQuaternion(_rotTmp).add(point);
  rig.quaternion.premultiply(_rotTmp);
}

/* ---------- imput ---------- */
const prevBtn = {};
const edge = (key, down) => { const was = !!prevBtn[key]; prevBtn[key] = down; return down && !was; };
function readInput() {
  const out = {
    turn: 0,
    fingers: { left: [0, 0, 0], right: [0, 0, 0] },
    menuEdge: false, recordEdge: false,
  };
  const session = renderer.xr.getSession();
  if (!session) return out;
  for (const src of session.inputSources) {
    const gp = src.gamepad, hand = src.handedness;
    if (!gp || (hand !== 'left' && hand !== 'right')) continue;
    const ax = gp.axes;
    const sx = ax.length >= 4 ? ax[2] : (ax[0] || 0);
    const bv = i => (gp.buttons[i] ? gp.buttons[i].value : 0);
    const bp = i => (gp.buttons[i] ? gp.buttons[i].pressed : false);

    out.fingers[hand] = [bv(0), bv(1), Math.max(bv(4), bv(5))];

    if (hand === 'left') {
      if (edge('menu', bp(4))) out.menuEdge = true;
    } else {
      out.turn += sx;
      if (edge('rec', bp(4))) out.recordEdge = true;
    }
  }
  return out;
}

/* ---------- facing and snap turn ---------- */
const _fwd = new V3(), _right = new V3(), _head = new V3();
function facing() {
  camera.getWorldDirection(_fwd);
  _fwd.y = 0;
  if (_fwd.lengthSq() < 1e-4) _fwd.set(0, 0, -1);
  _fwd.normalize();
  _right.crossVectors(_fwd, UP).normalize();
}

let turnLatch = false;
function snapTurn(turn) {
  if (Math.abs(turn) > 0.7) {
    if (!turnLatch) {
      camera.getWorldPosition(_head);
      rotateRigAround(_head, -Math.sign(turn) * SNAP);
      turnLatch = true;
    }
  } else if (Math.abs(turn) < 0.3) turnLatch = false;
}

/* ---------- random shi ig ---------- */
const touchC = newContact();
const sweepC = newContact();
function touchesSurface(p) {
  clearContact(touchC);
  _tmp.copy(p);
  resolve(_tmp, HAND_R, touchC);
  return touchC.hit && touchC.depth > 0.002;
}

let plantedCount = 0;
const plantedDesired = new V3();
const body = { vel: new V3() };

function updateHandTargets(dt, armScale, power) {
  camera.getWorldPosition(_w);
  rig.worldToLocal(_w);
  _shL.copy(_w);
  _shL.y -= SHOULDER_DROP;

  plantedCount = 0;
  plantedDesired.set(0, 0, 0);

  for (const side of SIDES) {
    const h = H[side];
    const slot = slotFor(side);
    if (!slot) {
      h.active = false; h.touching = false; h.hasPrev = false; h.hInit = false;
      continue;
    }
    h.active = true;

    // controller in rig spac
    slot.grip.getWorldPosition(_w);
    rig.worldToLocal(_w);
    _t1.subVectors(_w, _shL).multiplyScalar(armScale);
    h.target.copy(_shL).add(_t1);

    // hand velocity relative to the body (so walking and turning don't count)
    if (h.hasPrev && dt > 1e-4) {
      _t1.subVectors(h.target, h.prevTarget).multiplyScalar(1 / dt);
      h.u.lerp(_t1, 0.6);
    }
    h.prevTarget.copy(h.target);
    h.hasPrev = true;

    h.uw.copy(h.u).applyQuaternion(rig.quaternion);
    h.world.copy(h.target);
    rig.localToWorld(h.world);

    // the hand's motion kicks the body the other way?
    const touching = touchesSurface(h.world);
    if (touching && !h.touching && h.hInit) {
      body.vel.addScaledVector(h.uw, -IMPACT_GAIN * power);
    }
    h.touching = touching;

    if (touching) {
      plantedCount++;
      plantedDesired.addScaledVector(h.uw, -1);
    }
  }
  if (plantedCount) plantedDesired.multiplyScalar(1 / plantedCount);
  return plantedCount;
}

/* ---------- body physics ---------- */
const feet = newContact(), chest = newContact();
const _bp = new V3(), _dv = new V3();

function collideBody(y, r, c) {
  _bp.copy(rig.position);
  _bp.y += y;
  resolve(_bp, r, c);
  rig.position.set(_bp.x, _bp.y - y, _bp.z);
}

function respawn() {
  rig.position.set(0, 0, 0);
  rig.quaternion.identity();
  body.vel.set(0, 0, 0);
  for (const s of SIDES) H[s].hInit = false;
  setStatus('Back at spawn');
}

function stepBody(dt, planted, des) {
  const G = cfgVal('gravity');

  if (planted) {
    // accelerate toward the velocity that keeps the hand still
    // Gravity is reduced so wall-running probally works?
    body.vel.y -= G * PLANTED_GRAVITY * dt;
    _dv.subVectors(des, body.vel);
    const maxDv = PLANT_ACC * dt;
    if (_dv.length() > maxDv) _dv.setLength(maxDv);
    body.vel.add(_dv);
  } else {
    // gravity and light air drag, so momentum carries through
    body.vel.y -= G * dt;
    body.vel.multiplyScalar(Math.exp(-AIR_DRAG * dt));
  }
  if (body.vel.length() > MAX_SPEED) body.vel.setLength(MAX_SPEED);

  rig.position.addScaledVector(body.vel, dt);

  // Collision: feet then chest
  clearContact(feet); clearContact(chest);
  collideBody(FOOT_Y, FOOT_R, feet);
  collideBody(CHEST_Y, CHEST_R, chest);

  let grounded = false, mu = 1;
  for (const c of [feet, chest]) {
    if (!c.hit) continue;
    finishContact(c);
    const vn = body.vel.dot(c.nn);
    if (vn < 0) body.vel.addScaledVector(c.nn, -vn * (1 + c.bounce));
    if (c === feet && c.nn.y > 0.5) { grounded = true; mu = c.mu; }
  }

  // Ground friction
  if (grounded && !planted) {
    const f = Math.exp(-mu * FRICTION_K * dt);
    body.vel.x *= f;
    body.vel.z *= f;
  }

  if (rig.position.y < -20) respawn();
}

/* ---------- sweep against the level ---------- */
function moveHand(h, T) {
  _s.copy(h.prevH);
  _d.subVectors(T, h.prevH).multiplyScalar(1 / SUBSTEPS);
  for (let i = 0; i < SUBSTEPS; i++) {
    _s.add(_d);
    clearContact(sweepC);
    resolve(_s, HAND_R, sweepC);
  }
  h.H.copy(_s);
}

function moveHands(dt) {
  rig.updateMatrixWorld(true);
  const predictOn = cfgVal('predict');

  for (const side of SIDES) {
    const h = H[side];
    const slot = slotFor(side);
    if (!slot) { h.root.visible = false; continue; }
    h.root.visible = true;

    h.world.copy(h.target);
    rig.localToWorld(h.world);

    if (!h.hInit) {
      h.prevH.copy(h.world);
      h.H.copy(h.world);
      h.vis.copy(h.world);
      h.hInit = true;
    }

    moveHand(h, h.world);

    slot.grip.getWorldQuaternion(h.quat);
    h.root.quaternion.copy(h.quat);

    if (h.touching) {
      h.vis.copy(h.H); 
    } else {
      _pr.copy(h.H);
      if (predictOn) _pr.addScaledVector(h.uw, PREDICT_T);
      h.vis.lerp(_pr, 1 - Math.exp(-HAND_SMOOTH * dt));
    }
    h.root.position.copy(h.vis);
    h.prevH.copy(h.H);
  }
}

/* ---------- head, torso, tail, IK arms ---------- */
const _torso = new V3(), _shW = new V3(), _pole = new V3(), _back = new V3();
const _yaw = new Q();

function updateBody(t) {
  const armUp = BASE_ARM.upper * cfgVal('arm');
  const armFore = BASE_ARM.fore * cfgVal('arm');

  camera.getWorldPosition(_head);
  facing();
  _yaw.setFromUnitVectors(FWD0, _fwd);

  _torso.copy(_head).addScaledVector(UP, -0.42);
  torsoMesh.position.copy(_torso);
  torsoMesh.quaternion.copy(_yaw);

  headMesh.position.copy(_head).addScaledVector(UP, -0.12);
  headMesh.quaternion.copy(_yaw);

  _back.copy(_fwd).negate();
  tails.forEach((m, i) => {
    m.position.copy(_torso)
      .addScaledVector(_back, 0.22 + 0.07 * i)
      .addScaledVector(UP, -0.05 - i * 0.03 + Math.sin(t * 2.2 + i) * 0.03);
  });

  for (const side of SIDES) {
    const s = side === 'left' ? -1 : 1;
    const key = side === 'left' ? 'L' : 'R';
    const h = H[side];

    _shW.copy(_torso).addScaledVector(UP, 0.16).addScaledVector(_right, s * 0.22);

    const wrist = h.active
      ? h.vis
      : _shW.clone().addScaledVector(_fwd, 0.2).addScaledVector(UP, -0.4).addScaledVector(_right, s * 0.05);

    _pole.copy(_right).multiplyScalar(s * 0.7).addScaledVector(UP, -0.7).addScaledVector(_fwd, -0.3);
    const elbow = solveArm(_shW, wrist, _pole, armUp, armFore);
    placeSegment(arms[key].upper, _shW, elbow);
    placeSegment(arms[key].fore, elbow, wrist);
  }
}

/* ---------- Menu panel ---------- */
const menuCanvas = document.createElement('canvas');
menuCanvas.width = 1024; menuCanvas.height = 1100;
const mctx = menuCanvas.getContext('2d');
const menuTex = new THREE.CanvasTexture(menuCanvas);
menuTex.colorSpace = THREE.SRGBColorSpace;
const menuMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(1.6, 1.72),
  new THREE.MeshBasicMaterial({ map: menuTex, transparent: true })
);
menuMesh.visible = false;
scene.add(menuMesh);

let status = 'Press ENTER VR to start';
let menuHover = null;
let buttons = [];
let frames = [];
let recording = false;
let recStart = 0;

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function menuButtonsList() {
  const hasFrames = frames.length > 0;
  const col = [40, 544], row = i => 170 + i * 150, W = 440, H_ = 130;
  return [
    { id: 'arm', label: 'Arm length', sub: `${cfgVal('arm')}x`, color: '#58a6ff',
      x: col[0], y: row(0), w: W, h: H_, fn: () => cycle('arm') },
    { id: 'power', label: 'Launch power', sub: `${cfgVal('power')}x`, color: '#3fb950',
      x: col[1], y: row(0), w: W, h: H_, fn: () => cycle('power') },
    { id: 'predict', label: 'Prediction', sub: cfgVal('predict') ? 'on' : 'off', color: '#a371f7',
      x: col[0], y: row(1), w: W, h: H_, fn: () => cycle('predict') },
    { id: 'gravity', label: 'Gravity', sub: GRAVITY_NAMES[CFG.gravity], color: '#d29922',
      x: col[1], y: row(1), w: W, h: H_, fn: () => cycle('gravity') },
    { id: 'rec', label: recording ? 'Stop' : 'Record', sub: recording ? `${frames.length} frames` : 'start a take',
      color: recording ? '#f85149' : '#da3633', x: col[0], y: row(2), w: W, h: H_, fn: toggleRecord },
    { id: 'exp', label: 'Export GLTF', sub: hasFrames ? `${frames.length} frames` : 'record first',
      color: '#8957e5', x: col[1], y: row(2), w: W, h: H_, fn: exportGltf, disabled: !hasFrames },
    { id: 'clear', label: 'Clear take', sub: 'discard recording', color: '#00bfa6',
      x: col[0], y: row(3), w: W, h: H_, fn: () => { frames = []; setStatus('Take cleared'); } },
    { id: 'spawn', label: 'Back to spawn', sub: 'reset position', color: '#ff7a59',
      x: col[1], y: row(3), w: W, h: H_, fn: respawn },
    { id: 'reset', label: 'Reset mods', sub: 'back to defaults', color: '#6e7681',
      x: col[0], y: row(4), w: W, h: H_, fn: () => { for (const k in CFG) CFG[k] = 0; setStatus('Mods reset'); } },
    { id: 'close', label: 'Close menu', color: '#30363d', x: 40, y: 950, w: 944, h: 110,
      fn: () => toggleMenu(false) },
  ];
}

function drawButton(c, b) {
  const hot = menuHover === b.id;
  roundRect(c, b.x, b.y, b.w, b.h, 26);
  c.fillStyle = b.color + (b.disabled ? '22' : '55');
  c.fill();
  c.lineWidth = hot ? 8 : 3;
  c.strokeStyle = hot ? '#9dff9d' : 'rgba(255,255,255,0.15)';
  c.stroke();
  c.globalAlpha = b.disabled ? 0.4 : 1;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillStyle = '#eafcff';
  c.font = '600 44px system-ui, sans-serif';
  c.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 - (b.sub ? 18 : 0));
  if (b.sub) {
    c.fillStyle = 'rgba(200,230,255,0.75)';
    c.font = '26px system-ui, sans-serif';
    c.fillText(b.sub, b.x + b.w / 2, b.y + b.h / 2 + 34);
  }
  c.globalAlpha = 1;
}

function drawMenu() {
  const c = mctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, menuCanvas.width, menuCanvas.height);
  roundRect(c, 8, 8, menuCanvas.width - 16, menuCanvas.height - 16, 40);
  c.fillStyle = 'rgba(20,28,20,0.95)';
  c.fill();
  c.lineWidth = 4;
  c.strokeStyle = 'rgba(157,255,157,0.4)';
  c.stroke();
  c.textAlign = 'left';
  c.textBaseline = 'middle';
  c.fillStyle = '#9dff9d';
  c.font = '700 52px system-ui, sans-serif';
  c.fillText('Monke Arena', 50, 70);
  c.fillStyle = '#a7c4a7';
  c.font = '28px system-ui, sans-serif';
  c.fillText(status, 50, 120);
  buttons = menuButtonsList();
  buttons.forEach(b => drawButton(c, b));
  menuTex.needsUpdate = true;
}

function menuHitUV(uv) {
  if (!uv) return null;
  const x = uv.x * menuCanvas.width, y = (1 - uv.y) * menuCanvas.height;
  return buttons.find(b => !b.disabled && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) || null;
}

const _ro = new V3(), _rd = new V3(), _rq = new Q();
function menuButtonFromController(ctrl) {
  if (!menuMesh.visible) return null;
  ctrl.getWorldPosition(_ro);
  _rd.set(0, 0, -1).applyQuaternion(ctrl.getWorldQuaternion(_rq));
  menuRaycaster.set(_ro, _rd);
  const hit = menuRaycaster.intersectObject(menuMesh, false)[0];
  return hit ? menuHitUV(hit.uv) : null;
}

function setStatus(t) { status = t; drawMenu(); }

function placeMenu() {
  camera.getWorldPosition(_head);
  facing();
  menuMesh.position.copy(_head).addScaledVector(_fwd, 1.2);
  menuMesh.position.y = _head.y - 0.25;
  menuMesh.lookAt(_head);
}

function toggleMenu(force) {
  const open = force ?? !menuMesh.visible;
  if (open) { placeMenu(); drawMenu(); }
  menuMesh.visible = open;
}

/* ---------- Recording and GLTF export ---------- */
const parts = {
  torso: torsoMesh, head: headMesh,
  upper_arm_L: arms.L.upper, forearm_L: arms.L.fore, hand_L: H.left.root,
  upper_arm_R: arms.R.upper, forearm_R: arms.R.fore, hand_R: H.right.root,
};

function toggleRecord() {
  if (!recording) {
    recording = true;
    frames = [];
    recStart = performance.now();
    setStatus('Recording…');
  } else {
    recording = false;
    setStatus(`Take saved · ${frames.length} frames`);
  }
  drawMenu();
}

function captureFrame() {
  const rec = { t: (performance.now() - recStart) / 1000 };
  for (const n of PART_NAMES) {
    const o = parts[n];
    rec[n] = { p: o.position.clone(), q: o.quaternion.clone(), s: o.scale.clone() };
  }
  frames.push(rec);
}

function exportGltf() {
  if (!frames.length) { setStatus('Nothing recorded yet'); return; }
  setStatus('Building GLTF…');

  const geoFor = {
    torso: torsoGeo, head: headGeo,
    upper_arm_L: limbGeo, forearm_L: limbGeo, hand_L: handExportGeo,
    upper_arm_R: limbGeo, forearm_R: limbGeo, hand_R: handExportGeo,
  };
  const matFor = {
    torso: MAT.fur, head: MAT.fur,
    upper_arm_L: MAT.arm, forearm_L: MAT.arm, hand_L: MAT.hand,
    upper_arm_R: MAT.arm, forearm_R: MAT.arm, hand_R: MAT.hand,
  };

  const exportScene = new THREE.Scene();
  const times = frames.map(f => f.t);
  const tracks = [];
  for (const n of PART_NAMES) {
    const m = new THREE.Mesh(geoFor[n], matFor[n]);
    m.name = n;
    exportScene.add(m);
    const pv = [], qv = [], sv = [];
    for (const f of frames) {
      const k = f[n];
      pv.push(k.p.x, k.p.y, k.p.z);
      qv.push(k.q.x, k.q.y, k.q.z, k.q.w);
      sv.push(k.s.x, k.s.y, k.s.z);
    }
    tracks.push(new THREE.VectorKeyframeTrack(n + '.position', times, pv));
    tracks.push(new THREE.QuaternionKeyframeTrack(n + '.quaternion', times, qv));
    tracks.push(new THREE.VectorKeyframeTrack(n + '.scale', times, sv));
  }

  const clip = new THREE.AnimationClip('MonkeArena', times[times.length - 1] || 1, tracks);
  new GLTFExporter().parse(exportScene, gltf => {
    const blob = new Blob([JSON.stringify(gltf)], { type: 'model/gltf+json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `monke-arena-${Date.now()}.gltf`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    setStatus('GLTF downloaded');
  }, err => {
    console.error(err);
    setStatus('Export failed (see console)');
  }, { animations: [clip], binary: false });
}

/* gave up atp */
renderer.xr.addEventListener('sessionstart', () => {
  document.getElementById('hint').style.display = 'none';
  for (const s of SIDES) H[s].hInit = false;
  setStatus('Point and pull the trigger to use the menu');
  toggleMenu(true);
});
renderer.xr.addEventListener('sessionend', () => {
  document.getElementById('hint').style.display = '';
  toggleMenu(false);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
let elapsed = 0, uiTimer = 0;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const inp = readInput();

  if (inp.menuEdge) toggleMenu();
  if (inp.recordEdge) toggleRecord();

  const kf = 1 - Math.exp(-18 * dt);
  for (const side of SIDES) {
    const h = H[side];
    for (let i = 0; i < 3; i++) h.curl[i] += (inp.fingers[side][i] - h.curl[i]) * kf;
    applyFingers(h);
  }

  snapTurn(inp.turn);
  rig.updateMatrixWorld(true);

  const planted = updateHandTargets(dt, cfgVal('arm'), cfgVal('power'));

  stepBody(dt, planted > 0, plantedDesired);

  moveHands(dt);

  updateBody(elapsed);
  if (recording) captureFrame();

  let hover = null;
  if (menuMesh.visible) {
    for (const s of ctrlSlots) {
      const b = menuButtonFromController(s.ctrl);
      if (b) { hover = b.id; break; }
    }
  }
  if (hover !== menuHover) { menuHover = hover; drawMenu(); }
  uiTimer += dt;
  if (uiTimer > 0.5) { uiTimer = 0; if (menuMesh.visible) drawMenu(); }

  renderer.render(scene, camera);
});

drawMenu();
</script>
</body>

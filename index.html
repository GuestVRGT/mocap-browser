<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Browser MonkeMocap 🐒</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background: #0d1117; color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #ui {
      position: absolute; top: 12px; left: 12px; z-index: 20;
      background: rgba(13,17,23,0.85); padding: 14px 16px;
      border-radius: 12px; border: 1px solid #30363d;
      max-width: 280px; font-size: 13px; line-height: 1.45;
    }
    #ui h1 { margin: 0 0 6px; font-size: 18px; color: #7ee787; }
    #ui p { margin: 0 0 10px; opacity: 0.85; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    button {
      padding: 8px 14px; border: none; border-radius: 8px;
      font-weight: 600; font-size: 13px; cursor: pointer;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.96); }
    #recordBtn { background: #da3633; color: white; }
    #recordBtn.recording { background: #f85149; animation: pulse 1s infinite; }
    #stopBtn { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
    #downloadBtn { background: #238636; color: white; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
    #status { margin-top: 10px; font-size: 12px; color: #8b949e; }
    #video {
      position: absolute; bottom: 12px; right: 12px;
      width: 160px; height: 120px; border: 2px solid #30363d;
      border-radius: 10px; z-index: 10; transform: scaleX(-1);
      object-fit: cover; background: #000;
    }
    #canvas-container { width: 100vw; height: 100vh; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Browser MonkeMocap 🐒</h1>
    <p>Webcam body tracking + record pose data as JSON (inspired by MonkeMocap vibes)</p>
    <div class="btn-row">
      <button id="recordBtn">● Record</button>
      <button id="stopBtn" disabled>Stop</button>
      <button id="downloadBtn" disabled>Download JSON</button>
    </div>
    <div id="status">Waiting for camera…</div>
  </div>

  <video id="video" playsinline muted></video>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

  <script>
    // ---- simple monke / stick figure setup ----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 4.5);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x404040));
    const light = new THREE.DirectionalLight(0xffffff, 1.0);
    light.position.set(3, 8, 5);
    scene.add(light);

    // ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshLambertMaterial({ color: 0x161b22 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // simple joint spheres + bones
    const jointMat = new THREE.MeshLambertMaterial({ color: 0x7ee787 });
    const boneMat = new THREE.MeshLambertMaterial({ color: 0x3fb950 });
    const joints = [];
    const bones = [];

    // MediaPipe Pose connections (simplified)
    const POSE_CONNECTIONS = [
      [11,12],[11,13],[13,15],[12,14],[14,16], // arms
      [11,23],[12,24],[23,24],                 // torso
      [23,25],[25,27],[24,26],[26,28],         // legs
      [15,17],[15,19],[15,21],[16,18],[16,20],[16,22] // hands (optional)
    ];

    for (let i = 0; i < 33; i++) {
      const j = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), jointMat);
      j.visible = false;
      scene.add(j);
      joints.push(j);
    }

    POSE_CONNECTIONS.forEach(() => {
      const b = new THREE.Mesh(
        new THREE.CylinderGeometry(0.015, 0.015, 1),
        boneMat
      );
      b.visible = false;
      scene.add(b);
      bones.push(b);
    });

    // ---- recording state ----
    let recording = false;
    let recordedFrames = [];
    let startTime = 0;

    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusEl = document.getElementById('status');

    recordBtn.addEventListener('click', () => {
      recording = true;
      recordedFrames = [];
      startTime = performance.now();
      recordBtn.classList.add('recording');
      recordBtn.textContent = '● Recording…';
      recordBtn.disabled = true;
      stopBtn.disabled = false;
      downloadBtn.disabled = true;
      statusEl.textContent = 'Recording pose data… move around!';
    });

    stopBtn.addEventListener('click', () => {
      recording = false;
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '● Record';
      recordBtn.disabled = false;
      stopBtn.disabled = true;
      downloadBtn.disabled = recordedFrames.length === 0;
      statusEl.textContent = `Stopped. ${recordedFrames.length} frames captured.`;
    });

    downloadBtn.addEventListener('click', () => {
      const payload = {
        version: 1,
        type: 'mediapipe-pose',
        frameCount: recordedFrames.length,
        recordedAt: new Date().toISOString(),
        frames: recordedFrames
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `monke-mocap-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      statusEl.textContent = 'JSON downloaded! You can try mapping it to a Blender gorilla rig later.';
    });

    // ---- MediaPipe Pose ----
    const videoElement = document.getElementById('video');
    let lastLandmarks = null;

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults((results) => {
      if (!results.poseLandmarks) {
        joints.forEach(j => j.visible = false);
        bones.forEach(b => b.visible = false);
        return;
      }

      lastLandmarks = results.poseLandmarks;

      // update 3D joints (simple mapping: x right, y up, z toward camera)
      results.poseLandmarks.forEach((lm, i) => {
        const j = joints[i];
        j.visible = lm.visibility > 0.3;
        // MediaPipe is normalized 0-1, y down. Convert to roughly meters-ish
        j.position.set(
          (lm.x - 0.5) * 3.5,
          (0.5 - lm.y) * 3.5 + 1.2,
          -lm.z * 2.5
        );
      });

      // update bones
      POSE_CONNECTIONS.forEach((conn, idx) => {
        const a = joints[conn[0]];
        const b = joints[conn[1]];
        const bone = bones[idx];
        if (!a.visible || !b.visible) {
          bone.visible = false;
          return;
        }
        bone.visible = true;
        const mid = new THREE.Vector3().addVectors(a.position, b.position).multiplyScalar(0.5);
        bone.position.copy(mid);
        const dir = new THREE.Vector3().subVectors(b.position, a.position);
        const len = dir.length();
        bone.scale.set(1, len, 1);
        bone.quaternion.setFromUnitVectors(
          new THREE.Vector3(0, 1, 0),
          dir.clone().normalize()
        );
      });

      // record frame
      if (recording) {
        const t = (performance.now() - startTime) / 1000;
        recordedFrames.push({
          t,
          landmarks: results.poseLandmarks.map(lm => ({
            x: lm.x, y: lm.y, z: lm.z, visibility: lm.visibility
          }))
        });
        if (recordedFrames.length % 30 === 0) {
          statusEl.textContent = `Recording… ${recordedFrames.length} frames`;
        }
      }
    });

    // start camera
    async function start() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 640, height: 480 },
          audio: false
        });
        videoElement.srcObject = stream;
        await videoElement.play();

        const cam = new Camera(videoElement, {
          onFrame: async () => {
            await pose.send({ image: videoElement });
          },
          width: 640,
          height: 480
        });
        cam.start();
        statusEl.textContent = 'Camera ready! Stand so your whole body is visible, then hit Record.';
      } catch (err) {
        statusEl.textContent = 'Camera error: ' + err.message;
        console.error(err);
      }
    }
    start();

    // render loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>

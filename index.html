    const gltfLoader = new THREE.GLTFLoader();
    let rigReady = false;
    let rigHeight = 3;
    gltfLoader.parse(rigBytes, "", (gltf) => {
      const model = gltf.scene;
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);
      const desiredHeight = 3.0;
      const scale = desiredHeight / Math.max(size.y, 0.001);
      model.scale.setScalar(scale);
      model.position.set(-center.x * scale, -box.min.y * scale, -center.z * scale);
      rig.add(model);
      rigHeight = desiredHeight;
      rigReady = true;
    }, (error) => console.error("Could not load Gorilla Tag rig:", error));

    // Mouse and touch look controls.
    let yaw = 0, pitch = 0, looking = false, lastX = 0, lastY = 0;
    function beginLook(x,y){looking=true;lastX=x;lastY=y;}
    function moveLook(x,y){
      if(!looking)return;
      yaw-=(x-lastX)*0.004; pitch-=(y-lastY)*0.004;
      pitch=Math.max(-1.15,Math.min(1.15,pitch)); lastX=x;lastY=y;
    }
    document.addEventListener('mousedown',e=>beginLook(e.clientX,e.clientY));
    document.addEventListener('mouseup',()=>looking=false);
    document.addEventListener('mousemove',e=>moveLook(e.clientX,e.clientY));
    document.addEventListener('touchstart',e=>{if(e.touches.length)beginLook(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
    document.addEventListener('touchmove',e=>{if(e.touches.length)moveLook(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
    document.addEventListener('touchend',()=>looking=false,{passive:true});

    // Hand strokes propel the player rather than directly moving the rig.
    let velocity = new THREE.Vector3();
    let trackedHands = {};
    let lastPushTime = 0;
    const gravity = 18, groundY = 0, handPushStrength = 2.4, maxSpeed = 13;

    // ============ MEDIAPIPE HANDS ============
    const videoElement = document.getElementById('video');
    let wasPinching = false;
    function onResults(results) {
      const now=performance.now(), list=results.multiHandLandmarks||[], handed=results.multiHandedness||[], seen={};
      list.forEach((lm,i)=>{
        const label=handed[i]?.label||`hand${i}`, wrist=lm[0], middle=lm[12], thumb=lm[4];
        const current=new THREE.Vector3((0.5-wrist.x)*2.2,(0.5-wrist.y)*2.0+1.0,-0.6-Math.abs(middle.z||0)*0.5);
        seen[label]=true;
        const prev=trackedHands[label];
        if(prev){
          const dx=current.x-prev.position.x, dy=current.y-prev.position.y, dz=current.z-prev.position.z;
          const speed=Math.hypot(dx,dy,dz);
          if(speed>0.025&&now-lastPushTime>70){
            const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
            const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
            const push=new THREE.Vector3().addScaledVector(right,-dx*8)
              .addScaledVector(forward,Math.max(0,-dz*4)+Math.max(0,-dy*1.2));
            if(dy < -0.09 && rig.position.y<=0.18) push.y+=Math.min(5,Math.abs(dy)*12);
            if(push.length()>0.15){velocity.addScaledVector(push,handPushStrength);lastPushTime=now;}
          }
        }
        trackedHands[label]={position:current,seenAt:now};
        const pinchDist=Math.hypot(lm[8].x-thumb.x,lm[8].y-thumb.y);
        const pinching=pinchDist<0.045;
        if(pinching&&!wasPinching&&rig.position.y<=0.18)velocity.y=Math.max(velocity.y,4.5);
        wasPinching=pinching;
      });
      Object.keys(trackedHands).forEach(k=>{if(!seen[k]&&now-trackedHands[k].seenAt>500)delete trackedHands[k];});
    }
    const hands=new Hands({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.6,minTrackingConfidence:0.5});
    hands.onResults(onResults);

    // Prefer the rear/environment-facing camera, then gracefully fall back.
    async function startHandCamera(){
      const options=[
        {video:{facingMode:{exact:'environment'},width:{ideal:640},height:{ideal:480}},audio:false},
        {video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}},audio:false},
        {video:{width:{ideal:640},height:{ideal:480}},audio:false}
      ];
      let stream=null;
      for(const option of options){try{stream=await navigator.mediaDevices.getUserMedia(option);break;}catch(e){}}
      if(!stream){document.getElementById('info').innerHTML+='<br><b>Camera unavailable.</b> Allow camera access and open this page over HTTPS.';return;}
      videoElement.srcObject=stream; await videoElement.play();
      async function trackFrame(){
        if(videoElement.readyState>=2){try{await hands.send({image:videoElement});}catch(e){}}
        requestAnimationFrame(trackFrame);
      }
      trackFrame();
    }
    if(navigator.mediaDevices?.getUserMedia)startHandCamera();

    // ============ ANIMATION LOOP ============
    let previousFrame=performance.now();
    function animate(){
      requestAnimationFrame(animate);
      const now=performance.now(),dt=Math.min((now-previousFrame)/1000,0.04);previousFrame=now;
      velocity.y-=gravity*dt;
      velocity.multiplyScalar(Math.pow(0.985,dt*60));
      velocity.x=THREE.MathUtils.clamp(velocity.x,-maxSpeed,maxSpeed);
      velocity.z=THREE.MathUtils.clamp(velocity.z,-maxSpeed,maxSpeed);
      rig.position.addScaledVector(velocity,dt);
      if(rig.position.y<groundY){
        rig.position.y=groundY;if(velocity.y<0)velocity.y=0;
        velocity.x*=0.88;velocity.z*=0.88;
      }
      rig.position.x=THREE.MathUtils.clamp(rig.position.x,-18,18);
      rig.position.z=THREE.MathUtils.clamp(rig.position.z,-18,18);
      const eyeHeight=Math.max(1.2,rigHeight*0.78);
      camera.position.set(rig.position.x,rig.position.y+eyeHeight,rig.position.z);
      const direction=new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));
      camera.lookAt(camera.position.clone().add(direction));
      renderer.render(scene,camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

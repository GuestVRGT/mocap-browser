<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Permission Test</title>
  <style>
    body {
      margin: 0; padding: 20px; background: #111; color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { font-size: 14px; opacity: 0.8; margin-bottom: 24px; }
    button {
      display: block; width: 90%; max-width: 320px; margin: 14px auto;
      padding: 16px; font-size: 17px; border: none; border-radius: 12px;
      background: #4cbf56; color: white; font-weight: 600;
    }
    #log {
      margin-top: 28px; text-align: left; background: #222; padding: 14px;
      border-radius: 10px; font-size: 13px; white-space: pre-wrap;
      max-height: 50vh; overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>Permission Test</h1>
  <p>Tap button 1, then button 2.<br>Copy the black text after each tap.</p>

  <button id="orientBtn">1. Request Motion</button>
  <button id="camBtn">2. Request Camera</button>

  <div id="log">Waiting for you to tap a button…</div>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += '\n' + msg;
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    document.getElementById('orientBtn').addEventListener('click', async () => {
      log('--- Motion button tapped ---');
      try {
        if (typeof DeviceOrientationEvent === 'undefined') {
          log('DeviceOrientationEvent is not supported');
          return;
        }
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          log('Calling DeviceOrientationEvent.requestPermission()…');
          const result = await DeviceOrientationEvent.requestPermission();
          log('Permission result: ' + result);
        } else {
          log('No requestPermission method (not iOS Safari?).');
          window.addEventListener('deviceorientation', () => {});
          log('Listener added anyway.');
        }
      } catch (err) {
        log('ERROR: ' + err.name + ' – ' + err.message);
      }
    });

    document.getElementById('camBtn').addEventListener('click', async () => {
      log('--- Camera button tapped ---');
      try {
        log('Calling getUserMedia…');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        log('Camera permission granted!');
        stream.getTracks().forEach(t => t.stop());
      } catch (err) {
        log('ERROR: ' + err.name + ' – ' + err.message);
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Permission Test</title>
  <style>
    body {
      margin: 0; padding: 20px; background: #111; color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
    }
    h1 { font-size: 24px; }
    button {
      display: block; width: 90%; max-width: 320px; margin: 20px auto;
      padding: 18px; font-size: 18px; border: none; border-radius: 12px;
      background: #4cbf56; color: white; font-weight: 600;
    }
    #log {
      margin-top: 30px; text-align: left; background: #222; padding: 16px;
      border-radius: 10px; font-size: 14px; white-space: pre-wrap;
      max-height: 50vh; overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>Permission Test</h1>
  <p>Tap the buttons one by one so we can see what Safari does.</p>

  <button id="orientBtn">1. Request Motion / Orientation</button>
  <button id="camBtn">2. Request Camera</button>
  <button id="bothBtn">3. Request Both Together</button>

  <div id="log">Waiting for you to tap a button…</div>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += '\n' + msg;
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    // Button 1 – only orientation
    document.getElementById('orientBtn').addEventListener('click', async () => {
      log('--- Motion button tapped ---');
      try {
        if (typeof DeviceOrientationEvent === 'undefined') {
          log('DeviceOrientationEvent is not supported on this browser');
          return;
        }
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          log('Calling DeviceOrientationEvent.requestPermission()…');
          const result = await DeviceOrientationEvent.requestPermission();
          log('Permission result: ' + result);
          if (result === 'granted') {
            window.addEventListener('deviceorientation', e => {
              log('Got orientation data: alpha=' + e.alpha?.toFixed(1));
            });
          }
        } else {
          log('No requestPermission method (probably not iOS). Adding listener anyway.');
          window.addEventListener('deviceorientation', e => {
            log('Got orientation data: alpha=' + e.alpha?.toFixed(1));
          });
        }
      } catch (err) {
        log('ERROR: ' + err.name + ' – ' + err.message);
      }
    });

    // Button 2 – only camera
    document.getElementById('camBtn').addEventListener('click', async () => {
      log('--- Camera button tapped ---');
      try {
        log('Calling getUserMedia…');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        log('Camera permission granted! Stream received.');
        // stop tracks so we don’t keep the light on
        stream.getTracks().forEach(t => t.stop());
      } catch (err) {
        log('ERROR: ' + err.name + ' – ' + err.message);
      }
    });

    // Button 3 – both
    document.getElementById('bothBtn').addEventListener('click', async () => {
      log('--- Both button tapped ---');
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          log('Requesting orientation…');
          const o = await DeviceOrientationEvent.requestPermission();
          log('Orientation result: ' + o);
        }
        log('Requesting camera…');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        log('Camera granted!');
        stream.getTracks().forEach(t => t.stop());
      } catch (err) {
        log('ERROR: ' + err.name + ' – ' + err.message);
      }
    });
  </script>
</body>
</html>
